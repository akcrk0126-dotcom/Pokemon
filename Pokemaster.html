<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 TCG 마스터 시뮬레이터</title>
    <style>
        :root {
            --bg: #0b0d19;
            --panel: #16192b;
            --accent: #ffcb05;
            --text: #ffffff;
            --desk: #1e243d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: var(--panel); padding: 30px; border-radius: 15px;
            border: 2px solid var(--accent); width: 320px; text-align: center;
        }
        .auth-box input {
            width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;
            border: 1px solid #333; background: #0b0d19; color: #fff;
        }
        .auth-box button {
            width: 100%; padding: 10px; margin-top: 10px; background: var(--accent);
            border: none; font-weight: bold; border-radius: 6px; cursor: pointer;
        }

        .header-bar {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
            align-items: center; background: var(--panel); padding: 15px 25px; border-radius: 15px;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .user-info { font-size: 0.9rem; color: #aaa; }
        .gold-display { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .nav-btns button {
            padding: 8px 14px; margin-left: 3px; border-radius: 8px; border: none;
            background: #232740; color: white; font-weight: bold; cursor: pointer;
        }
        .nav-btns button.active { background: var(--accent); color: black; }

        .lang-switch { display: flex; gap: 5px; background: #0b0d19; padding: 4px; border-radius: 8px; border: 1px solid #333; }
        .lang-btn { padding: 5px 10px; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 0.8rem; }
        .lang-btn.active { background: var(--accent); color: black; }

        .view-section { display: none; width: 100%; max-width: 1100px; }
        .view-section.active { display: flex; flex-direction: column; align-items: center; }

        .shop-panel {
            background: var(--panel); width: 100%; padding: 25px; border-radius: 15px; text-align: center;
        }
        .series-select {
            width: 100%; max-width: 500px; padding: 12px; background: #0b0d19;
            color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; margin: 15px 0; font-weight: bold;
        }

        .open-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .table-controls { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .desk-area {
            width: 100%; height: 400px; background: var(--desk); border: 2px dashed #38426b;
            border-radius: 15px; position: relative; overflow: hidden;
        }

        .card-ui {
            width: 100%; height: 100%; border-radius: 8px; overflow: hidden;
            background: linear-gradient(135deg, #2b3252, #111425);
            border: 2px solid #56649c; display: flex; flex-direction: column;
            justify-content: space-between; padding: 8px; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); user-select: none;
        }
        .card-ui.rare { border-color: var(--accent); background: linear-gradient(135deg, #4a3b00, #1a1500); }
        .card-ui .card-title { font-weight: bold; font-size: 0.8rem; color: #fff; text-align: center; }
        .card-ui .card-type { font-size: 0.65rem; color: var(--accent); text-align: center; }
        .card-ui .card-art {
            width: 100%; height: 55%; background: #000; border-radius: 4px;
            display: flex; justify-content: center; align-items: center; font-size: 2.2rem;
        }
        .card-ui .card-lang-flag { position: absolute; top: 4px; left: 4px; font-size: 0.6rem; background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 3px; }

        .pack-drop-zone { width: 180px; height: 250px; margin-top: 15px; position: relative; perspective: 1000px; }
        .card-draggable {
            width: 180px; height: 250px; position: absolute; cursor: grab;
            transition: transform 0.1s ease; user-select: none;
        }
        
        .table-card { position: absolute; width: 120px; height: 170px; cursor: move; }

        .sleeve-effect { box-shadow: 0 0 15px rgba(255, 255, 255, 0.9) !important; border: 2px solid #fff !important; }
        .toploader-effect { border: 5px solid #7ec8ff !important; border-radius: 10px; box-shadow: 0 0 20px #0088ff !important; }
        .psa-badge {
            position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white;
            font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 1px solid white; z-index: 20;
        }

        .tool-zone { display: flex; gap: 10px; margin: 15px 0; }
        .tool-item {
            padding: 8px 12px; background: #232740; border: 1px dashed var(--accent);
            border-radius: 8px; cursor: grab; font-size: 0.85rem; font-weight: bold;
        }

        .binder-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px; width: 100%; background: #121526; padding: 20px; border-radius: 15px;
        }
        .binder-card { position: relative; border-radius: 8px; width: 130px; height: 180px; }

        .btn-action {
            padding: 10px 20px; background: var(--accent); border: none;
            border-radius: 6px; font-weight: bold; cursor: pointer; color: black;
        }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2 id="authTitle" style="color:var(--accent); margin-bottom:15px;">🔑 로그인 / 회원가입</h2>
            <input type="text" id="authId" placeholder="아이디">
            <input type="password" id="authPw" placeholder="비밀번호">
            <button id="authBtn" onclick="handleAuth()">시작하기</button>
        </div>
    </div>

    <div class="header-bar">
        <div>
            <span class="user-info"><span id="lblUser">유저</span>: <b id="displayUserId" style="color:#fff;">-</b></span>
            <div class="gold-display">💰 <span id="goldCount">10000</span> Gold</div>
        </div>

        <div class="lang-switch">
            <button class="lang-btn active" id="lang-ko" onclick="setLanguage('ko')">🇰🇷 한글판</button>
            <button class="lang-btn" id="lang-ja" onclick="setLanguage('ja')">🇯🇵 일판</button>
            <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">🇺🇸 북미판</button>
        </div>

        <div class="nav-btns">
            <button id="btnNavShop" class="active" onclick="switchView('shop')">🏪 상점</button>
            <button id="btnNavOpen" onclick="switchView('open')">🎴 개봉 테이블</button>
            <button id="btnNavBinder" onclick="switchView('binder')">📘 바인더 (<span id="binderCount">0</span>)</button>
            <button onclick="logout()" style="background:#e74c3c; color:white;">로그아웃</button>
        </div>
    </div>

    <div id="viewShop" class="view-section active">
        <div class="shop-panel">
            <h2 id="shopTitle">📦 포켓몬 카드 세트 선택</h2>
            <p id="shopSub" style="color:#aaa; font-size:0.85rem; margin-top:5px;">전 세계 발매된 모든 카드 세트를 선택해 팩을 뽑아보세요!</p>
            <select id="seriesSelect" class="series-select">
                <option value="">카드 세트 불러오는 중...</option>
            </select><br>
            <button id="buyBtn" class="btn-action" onclick="buyPack()">선택한 팩 구매 (1,000G)</button>
        </div>
    </div>

    <div id="viewOpen" class="view-section">
        <div class="open-container">
            <div class="table-controls">
                <div class="tool-zone">
                    <div class="tool-item" draggable="true" ondragstart="dragTool(event, 'sleeve')" id="toolSleeve">✨ 슬리브</div>
                    <div class="tool-item" draggable="true" ondragstart="dragTool(event, 'toploader')" id="toolToploader">🛡️ 탑로더</div>
                    <div class="tool-item" draggable="true" ondragstart="dragTool(event, 'psa')" id="toolPsa" style="border-color:#ff4757; color:#ff4757;">🔍 PSA 감정하기</div>
                </div>
                <button class="btn-action" style="background:#e74c3c; color:white;" onclick="refreshTable()" id="btnClear">🔄 테이블 청소</button>
            </div>

            <div class="desk-area" id="deskArea" ondragover="allowDrop(event)" ondrop="dropOnDesk(event)">
                <p id="deskNotice" style="position:absolute; top:45%; width:100%; text-align:center; color:#667; pointer-events:none; font-size:0.9rem;">
                    💡 카드를 <b>위로 드래그해서 날리면</b> 테이블 위에 안착합니다.<br>
                    (테이블 위 카드를 <b>더블클릭</b>하면 바인더로 저장됩니다)
                </p>
            </div>

            <div class="pack-drop-zone" id="packZone"></div>
        </div>
    </div>

    <div id="viewBinder" class="view-section">
        <h2 id="binderTitle" style="margin-bottom: 15px; color: var(--accent);">📘 내 수집 바인더</h2>
        <div class="binder-grid" id="binderGrid"></div>
    </div>

    <script>
        let currentLang = 'ko';
        let apiSets = [];

        const i18n = {
            ko: {
                flag: '🇰🇷', user: '유저', shop: '🏪 상점', open: '🎴 개봉 테이블', binder: '📘 바인더',
                shopTitle: '📦 포켓몬 카드 세트 선택', shopSub: '전 세계 발매된 모든 카드 세트를 선택해 팩을 뽑아보세요!',
                buyBtn: '선택한 팩 구매 (1,000G)', toolSleeve: '✨ 슬리브', toolToploader: '🛡️ 탑로더',
                toolPsa: '🔍 PSA 감정하기', btnClear: '🔄 테이블 청소', binderTitle: '📘 내 수집 바인더',
                notice: '💡 카드를 위로 드래그해서 날리면 테이블 위에 안착합니다.<br>(테이블 위 카드를 더블클릭하면 바인더로 저장됩니다)',
                saved: '📘 카드가 내 바인더에 안전하게 저장되었습니다!', emptyBinder: '바인더가 비어있습니다.'
            },
            ja: {
                flag: '🇯🇵', user: 'ユーザー', shop: '🏪 ショップ', open: '🎴 開封テーブル', binder: '📘 バインダー',
                shopTitle: '📦 ポケモンカードセット選択', shopSub: '全世界で発売された全カードセットを選択してパックを購入！',
                buyBtn: '選択したパックを購入 (1,000G)', toolSleeve: '✨ スリーブ', toolToploader: '🛡️ トップローダー',
                toolPsa: '🔍 PSA鑑定する', btnClear: '🔄 テーブル清掃', binderTitle: '📘 コレクション バインダー',
                notice: '💡 カードを上にスワイプして飛ばすとテーブルに置かれます。<br>(ダブルクリックでバインダーに保存)',
                saved: '📘 カードがバインダーに保存されました！', emptyBinder: 'バインダーが空です。'
            },
            en: {
                flag: '🇺🇸', user: 'User', shop: '🏪 Shop', open: '🎴 Opening Table', binder: '📘 Binder',
                shopTitle: '📦 Select Pokemon Card Set', shopSub: 'Select from all worldwide official Pokemon sets!',
                buyBtn: 'Buy Selected Pack (1,000G)', toolSleeve: '✨ Sleeve', toolToploader: '🛡️ Toploader',
                toolPsa: '🔍 PSA Grade', btnClear: '🔄 Clear Table', binderTitle: '📘 Collection Binder',
                notice: '💡 Drag & flick card upwards to land on table.<br>(Double-click card on table to save in Binder)',
                saved: '📘 Card safely stored in Binder!', emptyBinder: 'Binder is empty.'
            }
        };

        const builtInPokemon = [
            { name: { ko: "리자몽 ex", ja: "リザードン ex", en: "Charizard ex" }, type: { ko: "🔥 불꽃", ja: "🔥 ほのお", en: "🔥 Fire" }, rarity: "Rare SAR", emoji: "🐉", rare: true },
            { name: { ko: "피카츄 VMAX", ja: "ピカチュウ VMAX", en: "Pikachu VMAX" }, type: { ko: "⚡ 전기", ja: "⚡ でんき", en: "⚡ Lightning" }, rarity: "Rare Secret", emoji: "⚡", rare: true },
            { name: { ko: "뮤츠", ja: "ミュウツー", en: "Mewtwo" }, type: { ko: "🔮 에스퍼", ja: "🔮 ちょう", en: "🔮 Psychic" }, rarity: "Rare", emoji: "👽", rare: true },
            { name: { ko: "거북왕", ja: "カメックス", en: "Blastoise" }, type: { ko: "💧 물", ja: "💧 みず", en: "💧 Water" }, rarity: "Rare", emoji: "🐢", rare: true },
            { name: { ko: "이상해꽃", ja: "フシギバナ", en: "Venusaur" }, type: { ko: "🍃 풀", ja: "🍃 くさ", en: "🍃 Grass" }, rarity: "Rare", emoji: "🌺", rare: true },
            { name: { ko: "파이리", ja: "ヒトカゲ", en: "Charmander" }, type: { ko: "🔥 불꽃", ja: "🔥 ほのお", en: "🔥 Fire" }, rarity: "Common", emoji: "🦎", rare: false },
            { name: { ko: "꼬부기", ja: "ゼニガメ", en: "Squirtle" }, type: { ko: "💧 물", ja: "💧 みず", en: "💧 Water" }, rarity: "Common", emoji: "🐢", rare: false },
            { name: { ko: "이상해씨", ja: "フシギダネ", en: "Bulbasaur" }, type: { ko: "🍃 풀", ja: "🍃 くさ", en: "🍃 Grass" }, rarity: "Common", emoji: "🌱", rare: false },
            { name: { ko: "피카츄", ja: "ピカチュウ", en: "Pikachu" }, type: { ko: "⚡ 전기", ja: "⚡ でんき", en: "⚡ Lightning" }, rarity: "Common", emoji: "🖱️", rare: false },
            { name: { ko: "박사의 연구", ja: "博士の研究", en: "Professor's Research" }, type: { ko: "📜 트레이너", ja: "📜 トレーナー", en: "📜 Trainer" }, rarity: "Uncommon", emoji: "🧪", rare: false },
            { name: { ko: "하이퍼볼", ja: "ハイパーボール", en: "Ultra Ball" }, type: { ko: "🎾 트레이너", ja: "🎾 トレーナー", en: "🎾 Trainer" }, rarity: "Uncommon", emoji: "⚽", rare: false },
            { name: { ko: "기본 에너지", ja: "基本エネルギー", en: "Basic Energy" }, type: { ko: "💎 에너지", ja: "💎 エネルギー", en: "💎 Energy" }, rarity: "Common", emoji: "💎", rare: false }
        ];

        let currentUser = null;
        let gold = 10000;
        let binder = [];
        let currentPackCards = [];
        let currentCardIndex = 0;
        let tableCards = [];

        window.onload = async function() {
            try {
                // CORS 프록시 경유
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.pokemontcg.io/v2/sets'));
                const data = await res.json();
                if(data && data.data) {
                    apiSets = data.data.sort((a,b) => new Date(b.releaseDate) - new Date(a.releaseDate));
                }
                renderSetSelect();
            } catch(e) {
                renderSetSelect();
            }
        };

        function renderSetSelect() {
            const select = document.getElementById('seriesSelect');
            select.innerHTML = '';

            if (apiSets.length > 0) {
                apiSets.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `[${s.series}] ${s.name} (${s.total}장)`;
                    select.appendChild(opt);
                });
            } else {
                // API 실패 시 작동할 풍부한 팩 데이터 베이스
                const defaultSets = [
                    { id: 'sv4pt5', name: '[Scarlet & Violet] Paldean Fates (팔데아의 운명)' },
                    { id: 'sv3pt5', name: '[Scarlet & Violet] 151 (포켓몬 카드 151)' },
                    { id: 'sv1', name: '[Scarlet & Violet] Base Set (스칼렛&바이올렛)' },
                    { id: 'swsh12pt5', name: '[Sword & Shield] Crown Zenith (VSTAR 유니버스)' },
                    { id: 'swsh11', name: '[Sword & Shield] Lost Origin (로스트아비스)' },
                    { id: 'swsh7', name: '[Sword & Shield] Evolving Skies (이브이 히어로즈)' },
                    { id: 'swsh4', name: '[Sword & Shield] Vivid Voltage (앙천의 볼트태클)' },
                    { id: 'sm115', name: '[Sun & Moon] Hidden Fates (울트라샤이니)' },
                    { id: 'sm9', name: '[Sun & Moon] Team Up (태그볼트)' },
                    { id: 'xy12', name: '[XY] Evolutions (20주년 팩)' },
                    { id: 'base1', name: '[Classic] Base Set (초판 베이스 세트)' }
                ];
                defaultSets.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    select.appendChild(opt);
                });
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');

            const txt = i18n[lang];
            document.getElementById('lblUser').textContent = txt.user;
            document.getElementById('btnNavShop').textContent = txt.shop;
            document.getElementById('btnNavOpen').textContent = txt.open;
            document.getElementById('btnNavBinder').innerHTML = `${txt.binder} (<span id="binderCount">${binder.length}</span>)`;
            document.getElementById('shopTitle').textContent = txt.shopTitle;
            document.getElementById('shopSub').textContent = txt.shopSub;
            document.getElementById('buyBtn').textContent = txt.buyBtn;
            document.getElementById('toolSleeve').textContent = txt.toolSleeve;
            document.getElementById('toolToploader').textContent = txt.toolToploader;
            document.getElementById('toolPsa').textContent = txt.toolPsa;
            document.getElementById('btnClear').textContent = txt.btnClear;
            document.getElementById('binderTitle').textContent = txt.binderTitle;
            document.getElementById('deskNotice').innerHTML = txt.notice;

            renderDesk();
            if(document.getElementById('viewBinder').classList.contains('active')) {
                renderBinder();
            }
        }

        function handleAuth() {
            const id = document.getElementById('authId').value.trim();
            const pw = document.getElementById('authPw').value.trim();
            if(!id || !pw) return alert("아이디와 비밀번호를 입력하세요.");

            currentUser = id;
            document.getElementById('displayUserId').textContent = id;
            document.getElementById('authOverlay').style.display = 'none';

            const users = JSON.parse(localStorage.getItem('tcg_master_users') || '{}');
            if(!users[id]) users[id] = { gold: 10000, binder: [] };
            
            gold = users[id].gold;
            binder = users[id].binder;
            setLanguage('ko');
            updateUI();
        }

        function logout() { location.reload(); }

        function saveUserData() {
            if(!currentUser) return;
            const users = JSON.parse(localStorage.getItem('tcg_master_users') || '{}');
            users[currentUser] = { gold: gold, binder: binder };
            localStorage.setItem('tcg_master_users', JSON.stringify(users));
        }

        function updateUI() {
            document.getElementById('goldCount').textContent = gold.toLocaleString();
            document.getElementById('binderCount').textContent = binder.length;
        }

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
            if(view === 'shop') { document.getElementById('viewShop').classList.add('active'); document.getElementById('btnNavShop').classList.add('active'); }
            else if(view === 'open') { document.getElementById('viewOpen').classList.add('active'); document.getElementById('btnNavOpen').classList.add('active'); }
            else if(view === 'binder') { document.getElementById('viewBinder').classList.add('active'); document.getElementById('btnNavBinder').classList.add('active'); renderBinder(); }
        }

        function buyPack() {
            if(gold < 1000) return alert("골드가 부족합니다!");
            gold -= 1000;
            saveUserData();
            updateUI();
            switchView('open');

            const commons = builtInPokemon.filter(p => !p.rare);
            const rares = builtInPokemon.filter(p => p.rare);

            currentPackCards = [];
            for(let i=0; i<9; i++) {
                currentPackCards.push(commons[Math.floor(Math.random() * commons.length)]);
            }
            currentPackCards.push(rares[Math.floor(Math.random() * rares.length)]);

            currentCardIndex = 0;
            renderPackStack();
        }

        function createCardUI(card) {
            const cardEl = document.createElement('div');
            cardEl.className = `card-ui ${card.rare ? 'rare' : ''}`;
            
            const cardName = card.name[currentLang] || card.name['en'];
            const cardType = card.type[currentLang] || card.type['en'];
            const flag = i18n[currentLang].flag;

            cardEl.innerHTML = `
                <div class="card-lang-flag">${flag}</div>
                <div class="card-type">${cardType}</div>
                <div class="card-art">${card.emoji}</div>
                <div>
                    <div class="card-title">${cardName}</div>
                    <div style="font-size:0.6rem; text-align:center; color:#aaa; margin-top:2px;">${card.rarity}</div>
                </div>
            `;
            return cardEl;
        }

        function renderPackStack() {
            const packZone = document.getElementById('packZone');
            packZone.innerHTML = '';

            if(currentCardIndex >= currentPackCards.length) {
                packZone.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:80px;">🎉 Pack Complete!</p>';
                return;
            }

            const cardData = currentPackCards[currentCardIndex];
            const cardEl = document.createElement('div');
            cardEl.className = 'card-draggable';
            cardEl.appendChild(createCardUI(cardData));

            let startY = 0;
            cardEl.onmousedown = (e) => {
                startY = e.clientY;
                document.onmousemove = (e) => {
                    let diffY = e.clientY - startY;
                    if(diffY < 0) cardEl.style.transform = `translateY(${diffY}px) rotate(${diffY * 0.05}deg)`;
                };
                document.onmouseup = (e) => {
                    let diffY = e.clientY - startY;
                    document.onmousemove = null;
                    document.onmouseup = null;

                    if(diffY < -70) {
                        spawnCardOnDesk(cardData);
                        currentCardIndex++;
                        renderPackStack();
                    } else {
                        cardEl.style.transform = `translateY(0px)`;
                    }
                };
            };

            packZone.appendChild(cardEl);
        }

        function spawnCardOnDesk(cardData) {
            document.getElementById('deskNotice').style.display = 'none';
            const desk = document.getElementById('deskArea');
            
            const cardObj = {
                instanceId: Date.now() + Math.random(),
                data: cardData,
                sleeve: false,
                toploader: false,
                psa: null,
                x: Math.random() * (desk.clientWidth - 130),
                y: Math.random() * (desk.clientHeight - 180)
            };

            tableCards.push(cardObj);
            renderDesk();
        }

        function renderDesk() {
            const desk = document.getElementById('deskArea');
            document.querySelectorAll('.table-card').forEach(el => el.remove());

            tableCards.forEach((c) => {
                const el = document.createElement('div');
                el.className = 'table-card';
                if(c.sleeve) el.classList.add('sleeve-effect');
                if(c.toploader) el.classList.add('toploader-effect');

                el.style.left = c.x + 'px';
                el.style.top = c.y + 'px';

                el.appendChild(createCardUI(c.data));

                if(c.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${c.psa}`;
                    el.appendChild(badge);
                }

                el.onmousedown = (e) => {
                    let shiftX = e.clientX - el.getBoundingClientRect().left;
                    let shiftY = e.clientY - el.getBoundingClientRect().top;

                    document.onmousemove = (e) => {
                        let newX = e.clientX - shiftX - desk.getBoundingClientRect().left;
                        let newY = e.clientY - shiftY - desk.getBoundingClientRect().top;
                        el.style.left = newX + 'px';
                        el.style.top = newY + 'px';
                        c.x = newX; c.y = newY;
                    };
                    document.onmouseup = () => { document.onmousemove = null; };
                };

                el.ondblclick = () => {
                    binder.push({ ...c.data, sleeve: c.sleeve, toploader: c.toploader, psa: c.psa });
                    tableCards = tableCards.filter(tc => tc.instanceId !== c.instanceId);
                    saveUserData();
                    updateUI();
                    renderDesk();
                    alert(i18n[currentLang].saved);
                };

                el.ondragover = (e) => e.preventDefault();
                el.ondrop = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const tool = e.dataTransfer.getData('toolType');
                    if(tool === 'sleeve') c.sleeve = true;
                    if(tool === 'toploader') c.toploader = true;
                    if(tool === 'psa') {
                        const grades = [7, 8, 9, 9, 10];
                        c.psa = grades[Math.floor(Math.random() * grades.length)];
                        alert(`🔍 PSA Grade Result: [PSA ${c.psa}]`);
                    }
                    renderDesk();
                };

                desk.appendChild(el);
            });
        }

        function refreshTable() {
            if(confirm("테이블 위 카드를 모두 치우시겠습니까?")) {
                tableCards = [];
                renderDesk();
                document.getElementById('deskNotice').style.display = 'block';
            }
        }

        function dragTool(ev, type) { ev.dataTransfer.setData("toolType", type); }
        function allowDrop(ev) { ev.preventDefault(); }
        function dropOnDesk(ev) { ev.preventDefault(); }

        function renderBinder() {
            const grid = document.getElementById('binderGrid');
            grid.innerHTML = '';

            if(binder.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #aaa;">${i18n[currentLang].emptyBinder}</p>`;
                return;
            }

            binder.forEach((card) => {
                const item = document.createElement('div');
                item.className = 'binder-card';
                if(card.sleeve) item.classList.add('sleeve-effect');
                if(card.toploader) item.classList.add('toploader-effect');

                item.appendChild(createCardUI(card));

                if(card.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${card.psa}`;
                    item.appendChild(badge);
                }
                grid.appendChild(item);
            });
        }
    </script>
</body>
</html>
