<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 TCG - 커스텀 배경 & 3D 홀로그램 스튜디오</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');

    :root {
      --bg-dark: #08090c;
      --panel-bg: #12141d;
      --accent-yellow: #f1c40f;
      --card-w: 185px;
      --card-h: 260px;
    }

    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: radial-gradient(circle, #1a1e2b 0%, #050608 100%);
      color: #fff; font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden;
    }

    /* 로그인 화면 overlay */
    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 6, 8, 0.95); z-index: 200;
      display: flex; justify-content: center; align-items: center;
    }
    .auth-card {
      background: var(--panel-bg); border: 2px solid var(--accent-yellow);
      border-radius: 16px; padding: 30px; width: 360px; text-align: center;
      box-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
    }
    .auth-card h2 { margin-top: 0; color: var(--accent-yellow); }
    .auth-input {
      width: 100%; padding: 10px 14px; margin: 8px 0; border-radius: 8px;
      border: 1px solid #3b4258; background: #0a0c12; color: #fff; font-size: 14px;
    }
    .auth-btn {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none;
      background: var(--accent-yellow); color: #000; font-weight: bold; cursor: pointer;
      font-size: 15px; transition: 0.2s;
    }
    .auth-btn:hover { background: #d4ac0d; }

    header {
      width: 100%; padding: 12px 25px; background: var(--panel-bg);
      border-bottom: 2px solid #282c3c; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8); z-index: 10;
    }

    .title-logo { font-size: 18px; font-weight: 900; color: var(--accent-yellow); }
    .user-info-bar { display: flex; align-items: center; gap: 15px; }
    .gold-box {
      background: #000; border: 2px solid var(--accent-yellow);
      padding: 6px 14px; border-radius: 20px; font-weight: 900; color: var(--accent-yellow); font-size: 14px;
    }

    .nav-btn {
      background: #232736; color: #fff; border: 1px solid #444b60;
      padding: 8px 16px; border-radius: 6px; cursor: pointer;
      font-weight: bold; font-size: 13px; transition: 0.2s;
    }
    .nav-btn:hover { background: #343b52; color: var(--accent-yellow); border-color: var(--accent-yellow); }

    .main-stage {
      flex: 1; width: 100%; max-width: 1400px;
      display: flex; flex-direction: column; align-items: center; padding: 15px;
    }

    .card-table {
      width: 100%; height: 750px; position: relative;
      border: 2px solid #2d3345; border-radius: 14px; background: rgba(0,0,0,0.4);
      overflow: hidden; backdrop-filter: blur(5px);
    }

    .tool-zone {
      position: absolute; top: 15px; right: 15px; display: flex; gap: 12px;
      background: rgba(10,12,18,0.85); padding: 10px; border-radius: 12px; border: 1px solid #333a4e; z-index: 5;
    }
    .tool-box {
      width: 110px; height: 130px; border: 2px dashed var(--accent-yellow); border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; font-size: 11px; color: #fff; background: rgba(255,255,255,0.03);
    }
    .tool-box.drag-over { background: rgba(241, 196, 15, 0.3); transform: scale(1.05); }

    .bottom-zone { position: absolute; bottom: 15px; left: 15px; display: flex; gap: 12px; z-index: 5; }
    .sell-zone {
      width: 120px; height: 110px; border: 2px dashed #2ecc71; border-radius: 12px;
      background: rgba(46, 204, 113, 0.15); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #2ecc71; font-size: 12px; font-weight: bold; text-align: center;
    }
    .sell-zone.drag-over { background: rgba(46, 204, 113, 0.4); transform: scale(1.05); }

    .trash-zone {
      width: 100px; height: 110px; border: 2px dashed #e74c3c; border-radius: 12px;
      background: rgba(231, 76, 60, 0.15); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #e74c3c; font-size: 12px; font-weight: bold;
    }
    .trash-zone.drag-over { background: rgba(231, 76, 60, 0.4); transform: scale(1.05); }

    .unopened-pack {
      width: 170px; height: 260px; position: absolute;
      background: linear-gradient(135deg, #2c3e50, #000); border: 3px solid #f1c40f; border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; z-index: 50; text-align: center; padding: 10px;
    }

    .draggable-card {
      width: var(--card-w); height: var(--card-h); position: absolute; perspective: 1000px; cursor: grab; touch-action: none;
    }
    .draggable-card:active { cursor: grabbing; }

    .card-inner {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); border-radius: 10px; pointer-events: none;
    }
    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 10px; border: 3px solid #111; overflow: hidden;
    }

    .card-back {
      background: linear-gradient(135deg, #151e27 0%, #0a0e14 100%);
      display: flex; justify-content: center; align-items: center; border: 4px solid #1e824c;
    }
    .pokeball {
      width: 80px; height: 80px; background: linear-gradient(#e53935 45%, #111 45%, #111 55%, #f5f5f5 55%);
      border-radius: 50%; border: 6px solid #111;
    }

    .card-front {
      transform: rotateY(180deg); color: #000;
      display: flex; flex-direction: column; padding: 8px; font-size: 11px; position: relative;
      overflow: hidden;
    }

    /* 홀로그램 레이어 */
    .holo-overlay {
      position: absolute; top: 0; left: 0; width: 200%; height: 200%;
      background: linear-gradient(115deg, 
        transparent 20%, 
        rgba(255, 255, 255, 0.25) 30%, 
        rgba(255, 0, 128, 0.3) 40%, 
        rgba(0, 255, 255, 0.3) 50%, 
        rgba(255, 230, 0, 0.3) 60%, 
        transparent 80%);
      pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 3;
      mix-blend-mode: color-dodge; transform: translate(-25%, -25%);
    }

    .draggable-card:hover .holo-overlay { opacity: 0.8; animation: holoShift 3s infinite linear; }

    @keyframes holoShift {
      0% { transform: translate(-30%, -30%) rotate(0deg); }
      50% { transform: translate(-10%, -10%) rotate(5deg); }
      100% { transform: translate(-30%, -30%) rotate(0deg); }
    }

    /* CSS 자체 제작 포켓몬 타입별 백그라운드 디자인 */
    .bg-type-dragon {
      background: radial-gradient(circle at 50% 30%, #ff7675 0%, #d63031 50%, #2d3436 100%);
      background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 10px, transparent 10px, transparent 20px),
                        radial-gradient(circle, #e17055 20%, #d63031 80%);
    }
    .bg-type-psychic {
      background: radial-gradient(circle at 50% 30%, #a29bfe 0%, #6c5ce7 60%, #2d1436 100%);
      background-image: repeating-radial-gradient(circle at 50% 30%, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 15px, transparent 15px, transparent 30px);
    }
    .bg-type-fire {
      background: radial-gradient(circle at 50% 40%, #fffa65 0%, #ffaf40 40%, #ff3838 80%, #4b0000 100%);
    }
    .bg-type-electric {
      background: radial-gradient(circle at 50% 30%, #fff200 0%, #ffaf40 60%, #7d5fff 100%);
    }
    .bg-type-grass {
      background: radial-gradient(circle at 50% 30%, #7bed9f 0%, #2ed573 50%, #05c46b 80%, #1e3799 100%);
    }
    .bg-type-water {
      background: radial-gradient(circle at 50% 30%, #70a1ff 0%, #1e90ff 50%, #002f6c 100%);
    }

    .card-header { display: flex; justify-content: space-between; font-weight: 900; z-index: 2; background: rgba(255,255,255,0.85); padding: 3px 6px; border-radius: 4px; }
    
    .card-img-box {
      width: 100%; height: 125px; border: 2px solid #fff;
      border-radius: 6px; margin: 4px 0; display: flex; justify-content: center; align-items: center; 
      overflow: hidden; z-index: 2; position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    
    /* 포켓몬 전용 아우라 백그라운드 레이어 */
    .bg-aura {
      position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1;
      filter: blur(2px); opacity: 0.85;
    }

    .card-img-box img { width: 85%; height: 85%; object-fit: contain; z-index: 2; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6)); }
    
    .card-body { background: rgba(255,255,255,0.92); padding: 6px; border-radius: 6px; font-size: 10px; margin-top: auto; z-index: 2; }

    /* 희귀도별 테두리 및 프리즘 효과 */
    .rarity-R { border: 3px solid #74b9ff !important; }
    .rarity-RR { border: 3px solid #0984e3 !important; box-shadow: 0 0 10px rgba(9, 132, 227, 0.6); }
    .rarity-RRR { border: 3px solid #6c5ce7 !important; box-shadow: 0 0 15px rgba(108, 92, 231, 0.8); }
    .rarity-HR { border: 3px solid #e84393 !important; box-shadow: 0 0 25px rgba(232, 67, 147, 0.9); }
    .rarity-SAR { border: 3px solid #ff7675 !important; box-shadow: 0 0 20px rgba(255, 118, 117, 0.9); }
    .rarity-MUR { border: 4px solid #f1c40f !important; box-shadow: 0 0 35px rgba(241, 196, 15, 1); }

    /* 풀일러스트 전용 레이아웃 (HR / SAR / MUR) */
    .rarity-HR .card-front, .rarity-SAR .card-front, .rarity-MUR .card-front { padding: 0; }
    .rarity-HR .card-img-box, .rarity-SAR .card-img-box, .rarity-MUR .card-img-box { position: absolute; top:0; left:0; width:100%; height:100%; margin:0; border:none; border-radius:0; }
    .rarity-HR .card-img-box img, .rarity-SAR .card-img-box img, .rarity-MUR .card-img-box img { width: 95%; height: 95%; }
    .rarity-HR .card-header, .rarity-SAR .card-header, .rarity-MUR .card-header { position: absolute; top: 8px; left: 8px; right: 8px; background: rgba(0,0,0,0.7); color:#fff; }
    .rarity-HR .card-body, .rarity-SAR .card-body, .rarity-MUR .card-body { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,0.8); color:#fff; }

    /* 슬리브 / 탑로더 */
    .card-sleeve {
      position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
      border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 100%);
      pointer-events: none; display: none; z-index: 4;
    }
    .card-toploader {
      position: absolute; top: -7px; left: -7px; right: -7px; bottom: -7px;
      border: 5px solid rgba(120, 210, 255, 0.9); border-radius: 14px;
      background: linear-gradient(135deg, rgba(135,206,235,0.3) 0%, rgba(255,255,255,0.1) 100%);
      pointer-events: none; display: none; z-index: 4;
    }
    .has-sleeve .card-sleeve { display: block; }
    .has-toploader .card-toploader { display: block; }

    /* 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { background: var(--panel-bg); border: 2px solid #3b4258; border-radius: 12px; padding: 20px; max-width: 650px; width: 90%; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .pack-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
    .pack-card { background: #1e2230; border: 2px solid #3b4258; border-radius: 8px; padding: 12px; text-align: center; }
  </style>
</head>
<body>

  <!-- 1. 로그인 / 회원가입 화면 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2>⚡ TCG 수집가 로그인</h2>
      <p style="font-size:12px; color:#aaa; margin-bottom:15px;">아이디를 입력하고 로그인하세요.<br>(처음 입력하는 아이디는 새로 생성됩니다!)</p>
      <input type="text" id="usernameInput" class="auth-input" placeholder="아이디 (예: master123)">
      <input type="password" id="passwordInput" class="auth-input" placeholder="비밀번호">
      <button class="auth-btn" onclick="handleAuth()">시작하기 / 로그인</button>
    </div>
  </div>

  <!-- 2. 게임 메인 헤더 -->
  <header>
    <div class="title-logo">⚡ POKÉMON TCG LOCAL STORAGE</div>
    <div class="user-info-bar">
      <span style="font-size:14px; font-weight:bold; color:#74b9ff;">👤 <span id="currentUserName">게스트</span> 님</span>
      <div class="gold-box">💰 <span id="userGold">10,000</span> G</div>
      <button class="nav-btn" onclick="openShop()">🛒 카드팩 상점</button>
      <button class="nav-btn" style="background:#e74c3c; border-color:#c0392b;" onclick="handleLogout()">🚪 로그아웃</button>
    </div>
  </header>

  <!-- 3. 스테이지 -->
  <div class="main-stage">
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:10px;">
      <span style="font-size:13px; color:#aaa;">💾 커스텀 BG 및 홀로그램이 적용된 카드는 스토리지에 자동 저장됩니다.</span>
      <button class="nav-btn" style="background:#2980b9; border-color:#3498db;" onclick="flipAllCards()">🔄 전체 카드 뒤집기</button>
    </div>

    <div class="card-table" id="cardTable">
      <div class="tool-zone">
        <div class="tool-box" id="sleeveBox">
          <span style="font-size:24px;">📄</span><b>슬리브</b>
        </div>
        <div class="tool-box" id="toploaderBox">
          <span style="font-size:24px;">🛡️</span><b>탑로더</b>
        </div>
      </div>

      <div class="bottom-zone">
        <div class="sell-zone" id="sellBox">
          <span style="font-size:24px;">💰</span><span>카드 판매</span>
        </div>
        <div class="trash-zone" id="trashBox">
          <span style="font-size:24px;">🗑️</span><span>버리기</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 카드팩 상점 모달 -->
  <div class="modal" id="shopModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('shopModal')">X</button>
      <h2 style="margin:0;">🛒 카드팩 상점</h2>
      <div class="pack-grid">
        <div class="pack-card">
          <h4 style="color:#ff7675; margin:0 0 5px 0;">🔴 전설의 드래곤</h4>
          <button class="nav-btn" style="background:#e74c3c; width:100%; margin-top:10px;" onclick="buyPack('dragon')">1,000 G</button>
        </div>
        <div class="pack-card">
          <h4 style="color:#a29bfe; margin:0 0 5px 0;">🔮 환상의 환영</h4>
          <button class="nav-btn" style="background:#9b59b6; width:100%; margin-top:10px;" onclick="buyPack('psychic')">1,000 G</button>
        </div>
        <div class="pack-card">
          <h4 style="color:#ffeaa7; margin:0 0 5px 0;">⚡ 스타터 클래식</h4>
          <button class="nav-btn" style="background:#f1c40f; color:#000; width:100%; margin-top:10px;" onclick="buyPack('classic')">1,000 G</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sellPriceTable = { 
      "C": 100, "U": 250, "R": 600, "RR": 1500, "RRR": 3500, 
      "AR": 5000, "SR": 12000, "HR": 25000, "SAR": 45000, "MUR": 120000 
    };

    // 풍부해진 카드 pool (다양한 포켓몬 대거 확장)

        { id: "d_sar", name: "레쿠쟈 SAR", type: "dragon", hp: 280, skill: "화룡점정", rarity: "SAR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/384.png" },

        { id: "d_sr",  name: "한카리아스 SR", type: "dragon", hp: 220, skill: "드래곤클로", rarity: "SR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/445.png" },
        { id: "d_ar",  name: "망나뇽 AR", type: "dragon", hp: 160, skill: "용의파동", rarity: "AR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/149.png" },
        { id: "d_rrr", name: "무한다이노 VMAX RRR", type: "dragon", hp: 320, skill: "다이맥스캐논", rarity: "RRR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/890.png" },

        { id: "d_u1",  name: "미끄래곤 U", type: "dragon", hp: 130, skill: "아이언헤드", rarity: "U", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/706.png" },
        { id: "d_u2",  name: "크리만 U", type: "dragon", hp: 110, skill: "할퀴기", rarity: "U", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/621.png" },
        { id: "d_c1",  name: "딥상어동 C", type: "dragon", hp: 60, skill: "몸통박치기", rarity: "C", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/443.png" },

      ],
      psychic: [
        { id: "p_mur", name: "뮤츠 MUR", type: "psychic", hp: 320, skill: "사이코브레이크", rarity: "MUR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/150.png" },
        { id: "p_sar", name: "님피아 SAR", type: "psychic", hp: 220, skill: "드레인키스", rarity: "SAR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/700.png" },
        { id: "p_hr",  name: "펄기아 HR", type: "psychic", hp: 280, skill: "공간절단", rarity: "HR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/484.png" },

        { id: "c_rr2", name: "파이어 ex RR", type: "fire", hp: 200, skill: "불새", rarity: "RR", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/146.png" },

        { id: "c_u1",  name: "라이츄 U", type: "electric", hp: 120, skill: "10만볼트", rarity: "U", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/026.png" },
        { id: "c_c1",  name: "피카츄 C", type: "electric", hp: 60, skill: "전기쇼크", rarity: "C", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png" },
        { id: "c_c2",  name: "이상해씨 C", type: "grass", hp: 60, skill: "덩굴채찍", rarity: "C", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png" },
        { id: "c_c3",  name: "꼬부기 C", type: "water", hp: 60, skill: "물대포", rarity: "C", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/007.png" },
        { id: "c_c4",  name: "파이리 C", type: "fire", hp: 60, skill: "불꽃세례", rarity: "C", img: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/004.png" }
      ]
    };

    let currentUser = null;
    let userGold = 10000;
    let activeCards = [];
    let highestZIndex = 100;

    function handleAuth() {
      const user = document.getElementById('usernameInput').value.trim();
      if(!user) { alert("아이디를 입력해 주세요!"); return; }

      currentUser = user;
      document.getElementById('currentUserName').innerText = currentUser;
      document.getElementById('authOverlay').style.display = 'none';

      loadUserData();
    }

    function handleLogout() {
      saveUserData();
      currentUser = null;
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('usernameInput').value = '';
      document.getElementById('passwordInput').value = '';
      
      document.querySelectorAll('.draggable-card, .unopened-pack').forEach(el => el.remove());
      activeCards = [];
    }

    function saveUserData() {
      if(!currentUser) return;

      const dataToSave = {
        gold: userGold,
        cards: activeCards
      };

      localStorage.setItem(`pokemon_tcg_user_${currentUser}`, JSON.stringify(dataToSave));
    }

    function loadUserData() {
      const saved = localStorage.getItem(`pokemon_tcg_user_${currentUser}`);
      
      document.querySelectorAll('.draggable-card, .unopened-pack').forEach(el => el.remove());
      activeCards = [];

      if(saved) {
        const parsed = JSON.parse(saved);
        userGold = parsed.gold;
        activeCards = parsed.cards || [];
        
        activeCards.forEach(cData => renderCard(cData));
      } else {
        userGold = 10000;
        activeCards = [];
        spawnUnopenedPack('dragon');
      }

      document.getElementById('userGold').innerText = userGold.toLocaleString();
    }

    function openShop() { document.getElementById('shopModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function buyPack(packType) {
      if(userGold < 1000) { alert("골드가 부족합니다!"); return; }
      userGold -= 1000;
      document.getElementById('userGold').innerText = userGold.toLocaleString();
      closeModal('shopModal');
      spawnUnopenedPack(packType);
      saveUserData();
    }

    function spawnUnopenedPack(packType) {
      const table = document.getElementById('cardTable');
      const pack = document.createElement('div');
      pack.className = 'unopened-pack';
      pack.style.left = `${250 + Math.random() * 50}px`;
      pack.style.top = `${200 + Math.random() * 50}px`;
      
      pack.innerHTML = `
        <h3 style="margin:0; color:#f1c40f;">📦 BOOSTER PACK</h3>
        <p style="font-size:11px; margin-top:5px; color:#fff;">[클릭하여 개봉]</p>
      `;

      pack.onclick = () => {
        pack.remove();
        spawnStackedCards(packType);
      };

      table.appendChild(pack);
    }

    function getRandomRarity() {
      const rand = Math.random() * 100;
      if (rand < 0.05) return "MUR";
      if (rand < 0.20) return "HR";
      if (rand < 0.80) return "SAR";
      if (rand < 2.00) return "SR";
      if (rand < 5.00) return "AR";
      if (rand < 10.0) return "RRR";
      if (rand < 20.0) return "RR";
      if (rand < 35.0) return "R";
      if (rand < 60.0) return "U";
      return "C";
    }

    function spawnStackedCards(packType) {
      const pool = cardPool[packType] || cardPool.classic;
      const startX = 220 + Math.random() * 30;
      const startY = 200 + Math.random() * 30;

      for(let i = 0; i < 5; i++) {
        let targetRarity = getRandomRarity();
        let filtered = pool.filter(c => c.rarity === targetRarity);

        if (filtered.length === 0) {
          filtered = pool.filter(c => c.rarity === "C");
        }
        
        const baseData = filtered.length > 0 ? filtered[Math.floor(Math.random() * filtered.length)] : pool[0];

        const cardInstance = {
          uniqueId: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          ...baseData,
          x: startX + (4 - i) * 3,
          y: startY + (4 - i) * 3,
          isFlipped: false,
          hasSleeve: false,
          hasToploader: false
        };

        activeCards.push(cardInstance);
        renderCard(cardInstance);
      }
      saveUserData();
    }

    function renderCard(cData) {
      const table = document.getElementById('cardTable');
      const cardEl = document.createElement('div');
      cardEl.className = `draggable-card rarity-${cData.rarity} ${cData.hasSleeve ? 'has-sleeve' : ''} ${cData.hasToploader ? 'has-toploader' : ''}`;
      cardEl.id = cData.uniqueId;
      
      cardEl.style.left = `${cData.x}px`;
      cardEl.style.top = `${cData.y}px`;
      cardEl.style.zIndex = ++highestZIndex;

      // C / U를 제외한 모든 희귀도에 홀로그램 적용
      const isHolo = ["R", "RR", "RRR", "HR", "AR", "SR", "SAR", "MUR"].includes(cData.rarity);

      cardEl.innerHTML = `
        <div class="card-sleeve"></div>
        <div class="card-toploader"></div>
        <div class="card-inner ${cData.isFlipped ? 'flipped' : ''}">
          <div class="card-face card-back">
            <div class="pokeball"></div>
          </div>
          <div class="card-face card-front bg-type-${cData.type}">
            ${isHolo ? '<div class="holo-overlay"></div>' : ''}
            <div class="card-header">
              <span>${cData.name}</span>
              <span style="color:#e74c3c;">${cData.hp} HP</span>
            </div>
            <div class="card-img-box">
              <div class="bg-aura bg-type-${cData.type}"></div>
              <img src="${cData.img}" alt="Pokemon">
            </div>
            <div class="card-body">
              <b>기술: ${cData.skill}</b>
              <div style="margin-top:2px; font-weight:bold; color:#d63031;">[${cData.rarity}] (판매가: ${sellPriceTable[cData.rarity] || 100}G)</div>
            </div>
          </div>
        </div>
      `;

      cardEl.addEventListener('click', () => {
        const inner = cardEl.querySelector('.card-inner');
        if(!inner.classList.contains('flipped')) {
          inner.classList.add('flipped');
          cData.isFlipped = true;
          saveUserData();
        }
      });

      enableDrag(cardEl, cData);
      table.appendChild(cardEl);
    }

    function flipAllCards() {
      const allCardInners = document.querySelectorAll('.card-inner');
      allCardInners.forEach(card => card.classList.add('flipped'));
      activeCards.forEach(c => c.isFlipped = true);
      saveUserData();
    }

    function enableDrag(element, cardData) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      element.addEventListener('mousedown', startDrag);
      element.addEventListener('touchstart', startDrag, { passive: false });

      function startDrag(e) {
        isDragging = true;
        highestZIndex++;
        element.style.zIndex = highestZIndex;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = clientX;
        startY = clientY;
        initialLeft = element.offsetLeft;
        initialTop = element.offsetTop;

        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);
      }

      function moveDrag(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const newX = initialLeft + (clientX - startX);
        const newY = initialTop + (clientY - startY);

        element.style.left = `${newX}px`;
        element.style.top = `${newY}px`;

        cardData.x = newX;
        cardData.y = newY;

        checkDropZoneHover(element);
      }

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;

        document.removeEventListener('mousemove', moveDrag);
        document.removeEventListener('touchmove', moveDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchend', stopDrag);

        handleDropAction(element, cardData);
        saveUserData();
      }
    }

    function checkDropZoneHover(el) {
      const rect = el.getBoundingClientRect();
      document.getElementById('sleeveBox').classList.toggle('drag-over', isOverlapping(rect, document.getElementById('sleeveBox').getBoundingClientRect()));
      document.getElementById('toploaderBox').classList.toggle('drag-over', isOverlapping(rect, document.getElementById('toploaderBox').getBoundingClientRect()));
      document.getElementById('sellBox').classList.toggle('drag-over', isOverlapping(rect, document.getElementById('sellBox').getBoundingClientRect()));
      document.getElementById('trashBox').classList.toggle('drag-over', isOverlapping(rect, document.getElementById('trashBox').getBoundingClientRect()));
    }

    function handleDropAction(el, cardData) {
      const rect = el.getBoundingClientRect();
      const sleeveBox = document.getElementById('sleeveBox');
      const toploaderBox = document.getElementById('toploaderBox');
      const sellBox = document.getElementById('sellBox');
      const trashBox = document.getElementById('trashBox');

      if (isOverlapping(rect, sleeveBox.getBoundingClientRect())) {
        el.classList.add('has-sleeve');
        cardData.hasSleeve = true;
        sleeveBox.classList.remove('drag-over');
      } else if (isOverlapping(rect, toploaderBox.getBoundingClientRect())) {
        el.classList.add('has-sleeve', 'has-toploader');
        cardData.hasSleeve = true;
        cardData.hasToploader = true;
        toploaderBox.classList.remove('drag-over');
      } else if (isOverlapping(rect, sellBox.getBoundingClientRect())) {
        sellBox.classList.remove('drag-over');
        userGold += (sellPriceTable[cardData.rarity] || 100);
        document.getElementById('userGold').innerText = userGold.toLocaleString();
        activeCards = activeCards.filter(c => c.uniqueId !== cardData.uniqueId);
        el.remove();
      } else if (isOverlapping(rect, trashBox.getBoundingClientRect())) {
        trashBox.classList.remove('drag-over');
        activeCards = activeCards.filter(c => c.uniqueId !== cardData.uniqueId);
        el.remove();
      }
    }

    function isOverlapping(r1, r2) {
      return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }
  </script>
