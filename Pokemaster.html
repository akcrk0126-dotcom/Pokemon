<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 TCG 마스터 시뮬레이터 Ultimate</title>
    <style>
        :root {
            --bg: #0b0d19;
            --panel: #16192b;
            --accent: #ffcb05;
            --text: #ffffff;
            --desk: #1e243d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: var(--panel); padding: 30px; border-radius: 15px;
            border: 2px solid var(--accent); width: 320px; text-align: center;
        }
        .auth-box input {
            width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;
            border: 1px solid #333; background: #0b0d19; color: #fff;
        }
        .auth-box button {
            width: 100%; padding: 10px; margin-top: 10px; background: var(--accent);
            border: none; font-weight: bold; border-radius: 6px; cursor: pointer;
        }

        .header-bar {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
            align-items: center; background: var(--panel); padding: 15px 25px; border-radius: 15px;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .gold-display { font-size: 1.1rem; font-weight: bold; color: var(--accent); display: flex; gap: 15px; align-items: center;}
        .pack-badge { font-size: 0.95rem; color: #4bcffa; background: #1a2744; padding: 4px 10px; border-radius: 20px; border: 1px solid #4bcffa; }

        .nav-btns button {
            padding: 8px 14px; margin-left: 3px; border-radius: 8px; border: none;
            background: #232740; color: white; font-weight: bold; cursor: pointer;
        }
        .nav-btns button.active { background: var(--accent); color: black; }

        .view-section { display: none; width: 100%; max-width: 1100px; }
        .view-section.active { display: flex; flex-direction: column; align-items: center; }

        .shop-panel {
            background: var(--panel); width: 100%; padding: 25px; border-radius: 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .series-select {
            width: 100%; max-width: 650px; padding: 12px; background: #0b0d19;
            color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; margin: 15px 0; font-weight: bold;
        }
        .shop-buy-box {
            display: flex; align-items: center; gap: 10px; margin-top: 15px; background: #0b0d19; padding: 15px 25px; border-radius: 12px; border: 1px solid #333;
        }
        .shop-buy-box input {
            width: 70px; padding: 8px; text-align: center; background: #16192b; color: #fff; border: 1px solid var(--accent); border-radius: 6px; font-weight: bold; font-size: 1rem;
        }

        .open-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .desk-area {
            width: 100%; height: 480px; background: var(--desk); border: 2px dashed #38426b;
            border-radius: 15px; position: relative; overflow: hidden; margin-top: 10px;
        }

        .pack-open-stage {
            width: 100%; background: var(--panel); border-radius: 15px; padding: 20px;
            margin-top: 15px; display: flex; flex-direction: column; align-items: center; min-height: 250px;
        }
        .pack-wrapper {
            width: 170px; height: 250px; background: #111;
            border: 3px solid var(--accent); border-radius: 12px; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; cursor: pointer; padding: 12px;
            box-shadow: 0 10px 25px rgba(255,203,5,0.3); transition: transform 0.2s;
        }
        .pack-wrapper:hover { transform: scale(1.05); }
        .pack-art { width: 100%; height: 140px; object-fit: contain; }

        .cards-pack-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 15px; width: 100%; }
        .card-flip-container { width: 110px; height: 154px; perspective: 1000px; cursor: pointer; position: relative; }
        .card-inner { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.5s; border-radius: 8px; }
        .card-flip-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 8px; overflow: hidden; }
        .card-back { background: linear-gradient(135deg, #1b2755, #0a0f24); border: 2px solid var(--accent); display: flex; justify-content: center; align-items: center; }
        .card-back::after { content: '🌀'; font-size: 2rem; }
        .card-front { transform: rotateY(180deg); background-size: cover; background-position: center; }

        .table-card { position: absolute; width: 110px; height: 154px; cursor: grab; border-radius: 8px; transition: box-shadow 0.2s; }
        .table-card:active { cursor: grabbing; }
        .table-card .card-ui { width: 100%; height: 100%; border-radius: 8px; background-size: cover; background-position: center; pointer-events: none; }

        .card-menu {
            position: absolute; top: -38px; left: 50%; transform: translateX(-50%);
            background: rgba(17,17,17,0.95); border: 1px solid var(--accent); border-radius: 6px; padding: 3px;
            display: none; gap: 4px; z-index: 99999; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .table-card:hover .card-menu { display: flex; }
        .card-menu button {
            background: #222; color: #fff; border: none; padding: 3px 6px; font-size: 0.75rem; border-radius: 4px; cursor: pointer;
        }
        .card-menu button:hover { background: var(--accent); color: #000; }

        .sleeve-effect { box-shadow: 0 0 12px rgba(255, 255, 255, 0.9) !important; border: 2px solid #fff !important; }
        .toploader-effect { border: 4px solid #7ec8ff !important; box-shadow: 0 0 15px #0088ff !important; }
        .psa-badge {
            position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white;
            font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 8px; border: 1px solid white; z-index: 20;
        }

        .binder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; width: 100%; background: #121526; padding: 20px; border-radius: 15px; }
        .binder-card { position: relative; border-radius: 8px; width: 110px; height: 154px; }

        .btn-action { padding: 10px 20px; background: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: black; }
        .action-controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2 style="color:var(--accent); margin-bottom:15px;">🔑 포켓몬 TCG 로그인</h2>
            <input type="text" id="authId" placeholder="아이디" value="Master">
            <input type="password" id="authPw" placeholder="비밀번호" value="1234">
            <button onclick="handleAuth()">게임 시작하기</button>
        </div>
    </div>

    <div class="header-bar">
        <div>
            <span class="user-info">유저: <b id="displayUserId" style="color:#fff;">-</b></span>
            <div class="gold-display">
                <span>💰 <span id="goldCount">100000</span> Gold</span>
                <span class="pack-badge">📦 보유 팩: <b id="packInventoryCount">0</b>개</span>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
            <div class="nav-btns">
                <button id="btnNavShop" class="active" onclick="switchView('shop')">🏪 상점</button>
                <button id="btnNavOpen" onclick="switchView('open')">🎴 개봉 테이블</button>
                <button id="btnNavBinder" onclick="switchView('binder')">📘 바인더 (<span id="binderCount">0</span>)</button>
                <button onclick="logout()" style="background:#e74c3c; color:white;">로그아웃</button>
            </div>
        </div>
    </div>

    <!-- 상점 뷰 -->
    <div id="viewShop" class="view-section active">
        <div class="shop-panel">
            <h2>📦 Pokémon TCG Booster Pack Shop (전체 200여개 세트)</h2>
            <p style="color:#aaa; font-size:0.85rem; margin-top:5px;">원하는 공식 영판 확장팩을 선택하여 구매하세요.</p>
            
            <select id="seriesSelect" class="series-select" onchange="updatePackPreview()">
                <option value="">팩 목록 로딩 중...</option>
            </select>

            <div id="shopPackPreview" style="margin: 10px 0; min-height: 160px; display: flex; align-items: center; justify-content: center;">
                <img id="previewPackImg" src="" style="height: 160px; object-fit: contain;">
            </div>

            <div class="shop-buy-box">
                <label for="buyPackCount">구매 수량: </label>
                <input type="number" id="buyPackCount" value="1" min="1" max="99">
                <button class="btn-action" onclick="buyPacks()">팩 구매하기 (<span id="totalCost">1,000</span>G)</button>
            </div>
        </div>
    </div>

    <!-- 개봉 및 테이블 뷰 -->
    <div id="viewOpen" class="view-section">
        <div class="open-container">
            <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                <p style="color:#aaa; font-size:0.85rem;">💡 카드를 클릭하면 테이블로 이동하며, 자유롭게 겹치거나 배치할 수 있습니다.</p>
                <div>
                    <button class="btn-action" id="btnFlipAll" onclick="flipAllCards()" disabled style="background:#4bcffa; color:black; padding:6px 12px; font-size:0.85rem;">🔄 전체 뒤집기</button>
                    <button class="btn-action" style="background:#e74c3c; color:white; padding:6px 12px; font-size:0.85rem;" onclick="refreshTable()">🧹 테이블 청소</button>
                </div>
            </div>

            <div class="desk-area" id="deskArea">
                <p id="deskNotice" style="position:absolute; top:45%; width:100%; text-align:center; color:#667; pointer-events:none; font-size:0.9rem;">
                    💡 카드를 <b>클릭</b>하여 테이블로 보낸 후 자유롭게 이동해 보세요!<br>(테이블 위 카드를 <b>더블클릭</b>하면 바인더로 저장됩니다)
                </p>
            </div>

            <div class="pack-open-stage">
                <div id="packZone"></div>
                <div class="cards-pack-grid" id="packCardsGrid"></div>
                
                <div class="action-controls" id="nextActionZone" style="display:none;">
                    <button class="btn-action" id="btnNextPack" onclick="openNextPack()" style="background:#2ed573; color:white;">⚡ 바로 다음 팩 까기</button>
                    <button class="btn-action" onclick="switchView('shop')" style="background:#57606f; color:white;">🏪 팩 선택 화면 복귀</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 바인더 뷰 -->
    <div id="viewBinder" class="view-section">
        <h2 style="margin-bottom: 15px; color: var(--accent);">📘 내 수집 바인더</h2>
        <div class="binder-grid" id="binderGrid"></div>
    </div>

    <script>
        let currentUser = null;
        let gold = 100000;
        let packInventory = 0;
        let selectedSet = null;
        let fullSetsList = [];
        let binder = [];
        let currentPackCards = [];
        let tableCards = [];
        let globalZIndex = 100;

        // 주요 한국어 명칭 수동 매핑 디렉셔너리
        const setKoreanNames = {
            "sv8": "초전브레이커",
            "sv7a": "낙원드래고나",
            "sv7": "스텔라미라클",
            "sv6a": "나이트원더러",
            "sv6": "변형의 가면",
            "sv5a": "크림슨헤이즈",
            "sv5m": "사이버저지",
            "sv5k": "와일드포스",
            "sv4a": "샤이니 보물 ex",
            "sv3pt5": "포켓몬 카드 151",
            "swsh12pt5": "VSTAR 유니버스",
            "swsh7": "이브이 히어로즈",
            "base1": "베이스 세트 (초판)"
        };

        window.onload = async function() {
            document.getElementById('buyPackCount').addEventListener('input', (e) => {
                const count = Math.max(1, parseInt(e.target.value) || 1);
                document.getElementById('totalCost').textContent = (count * 1000).toLocaleString();
            });

            await fetchAllSetsFromAPI();
        };

        // API에서 실제 정식 Pokémon TCG 세트 전체(200여 개) 로드
        async function fetchAllSetsFromAPI() {
            try {
                const res = await fetch('https://api.pokemontcg.io/v2/sets');
                const data = await res.json();
                if (data && data.data) {
                    fullSetsList = data.data;
                    renderSetSelect();
                }
            } catch (e) {
                console.error("세트 목록을 불러오는데 실패했습니다.", e);
            }
        }

        function renderSetSelect() {
            const select = document.getElementById('seriesSelect');
            select.innerHTML = '';

            fullSetsList.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                
                // 한국어 명칭이 있는 경우 함께 표시
                const krName = setKoreanNames[s.id] ? ` [${setKoreanNames[s.id]}]` : '';
                opt.textContent = `${s.name}${krName} (${s.printedTotal} Cards) - ${s.series}`;
                select.appendChild(opt);
            });

            if (fullSetsList.length > 0) {
                selectedSet = fullSetsList[0];
                updatePackPreview();
            }
        }

        function updatePackPreview() {
            const setId = document.getElementById('seriesSelect').value;
            selectedSet = fullSetsList.find(s => s.id === setId) || fullSetsList[0];
            
            const previewImg = document.getElementById('previewPackImg');
            // 영판 공식 팩 심볼/로고 이미지 설정
            if (selectedSet && selectedSet.images) {
                previewImg.src = selectedSet.images.logo || selectedSet.images.symbol;
            }
        }

        function handleAuth() {
            const id = document.getElementById('authId').value.trim();
            if(!id) return alert("아이디를 입력하세요!");
            currentUser = id;
            document.getElementById('displayUserId').textContent = id;
            document.getElementById('authOverlay').style.display = 'none';

            const users = JSON.parse(localStorage.getItem('tcg_master_users') || '{}');
            if(!users[id]) users[id] = { gold: 100000, packInventory: 0, binder: [] };
            gold = users[id].gold || 100000;
            packInventory = users[id].packInventory || 0;
            binder = users[id].binder || [];
            updateUI();
        }

        function logout() { location.reload(); }

        function saveUserData() {
            if(!currentUser) return;
            const users = JSON.parse(localStorage.getItem('tcg_master_users') || '{}');
            users[currentUser] = { gold: gold, packInventory: packInventory, binder: binder };
            localStorage.setItem('tcg_master_users', JSON.stringify(users));
        }

        function updateUI() {
            document.getElementById('goldCount').textContent = gold.toLocaleString();
            document.getElementById('packInventoryCount').textContent = packInventory;
            document.getElementById('binderCount').textContent = binder.length;
        }

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
            if(view === 'shop') { 
                document.getElementById('viewShop').classList.add('active'); 
                document.getElementById('btnNavShop').classList.add('active'); 
            }
            else if(view === 'open') { 
                document.getElementById('viewOpen').classList.add('active'); 
                document.getElementById('btnNavOpen').classList.add('active'); 
                if(currentPackCards.length === 0) renderPackToOpen();
            }
            else if(view === 'binder') { 
                document.getElementById('viewBinder').classList.add('active'); 
                document.getElementById('btnNavBinder').classList.add('active'); 
                renderBinder(); 
            }
        }

        function buyPacks() {
            const count = Math.max(1, parseInt(document.getElementById('buyPackCount').value) || 1);
            const totalCost = count * 1000;

            if(gold < totalCost) return alert("골드가 부족합니다!");
            
            gold -= totalCost;
            packInventory += count;
            saveUserData();
            updateUI();
            
            alert(`${count}개의 [${selectedSet.name}] 팩을 구매했습니다!`);
            switchView('open');
            renderPackToOpen();
        }

        function renderPackToOpen() {
            const packZone = document.getElementById('packZone');
            const grid = document.getElementById('packCardsGrid');
            document.getElementById('nextActionZone').style.display = 'none';
            grid.innerHTML = '';
            document.getElementById('btnFlipAll').disabled = true;

            if (packInventory <= 0) {
                packZone.innerHTML = `<p style="color:#aaa;">보유한 카드팩이 없습니다.</p>`;
                return;
            }

            const packLogo = selectedSet.images ? (selectedSet.images.logo || selectedSet.images.symbol) : '';

            packZone.innerHTML = `
                <div class="pack-wrapper" onclick="openPack()">
                    <div style="font-weight:bold; color:var(--accent); text-align:center; font-size:0.95rem;">${selectedSet.name}</div>
                    <img src="${packLogo}" class="pack-art" alt="Pack Logo">
                    <div style="font-size:0.85rem; color:var(--accent); font-weight:bold;">👉 OPEN!</div>
                </div>
            `;
        }

        async function openPack() {
            if (packInventory <= 0 || !selectedSet) return;

            packInventory--;
            saveUserData();
            updateUI();

            const packZone = document.getElementById('packZone');
            const grid = document.getElementById('packCardsGrid');
            packZone.innerHTML = `<p style="color:var(--accent); font-weight:bold;">✨ [${selectedSet.name}] 개봉 완료!</p>`;
            document.getElementById('btnFlipAll').disabled = false;
            grid.innerHTML = '<p style="color:#aaa;">해당 팩의 카드 불러오는 중...</p>';

            let fetchedCards = [];

            try {
                // 정확히 선택한 세트(set.id)에 일치하는 카드 30장을 조회
                const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${selectedSet.id}&pageSize=30`);
                const data = await res.json();
                if(data && data.data && data.data.length > 0) {
                    fetchedCards = data.data;
                }
            } catch(e) {
                console.error("API 카드 로드 실패:", e);
            }

            currentPackCards = [];

            // 5장 무작위 뽑기 (선택된 팩에서만 출현)
            for(let i = 0; i < 5; i++) {
                if(fetchedCards.length > 0) {
                    const randomPick = fetchedCards[Math.floor(Math.random() * fetchedCards.length)];
                    currentPackCards.push({
                        id: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        name: randomPick.name,
                        image: randomPick.images.large || randomPick.images.small
                    });
                }
            }

            grid.innerHTML = '';
            currentPackCards.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-flip-container';
                cardEl.id = `packCard_${idx}`;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front" style="background-image: url(&quot;${card.image}&quot;); background-size: cover; background-position: center;"></div>
                    </div>
                `;

                cardEl.onclick = () => {
                    if(!cardEl.classList.contains('flipped')) {
                        cardEl.classList.add('flipped');
                    } else {
                        sendCardToDesk(card);
                        cardEl.style.opacity = '0.3';
                        cardEl.style.pointerEvents = 'none';
                    }
                };

                grid.appendChild(cardEl);
            });

            const nextBtn = document.getElementById('btnNextPack');
            document.getElementById('nextActionZone').style.display = 'flex';

            if(packInventory > 0) {
                nextBtn.innerText = `⚡ 바로 다음 팩 까기 (${packInventory}개 남음)`;
            } else {
                nextBtn.innerText = `모든 팩 개봉 완료!`;
            }
        }

        function sendCardToDesk(cardData) {
            document.getElementById('deskNotice').style.display = 'none';
            
            const existing = tableCards.find(c => c.instanceId === cardData.id);
            if(existing) return;

            const offset = (tableCards.length * 25) % 250;

            const cardObj = {
                instanceId: cardData.id,
                data: cardData,
                sleeve: false,
                toploader: false,
                psa: null,
                x: 30 + offset,
                y: 30 + (offset / 2),
                zIndex: ++globalZIndex
            };

            tableCards.push(cardObj);
            renderDesk();
        }

        function openNextPack() {
            if(packInventory <= 0) {
                alert("보유한 팩을 모두 개봉했습니다!");
                switchView('shop');
                return;
            }
            openPack();
        }

        function flipAllCards() {
            currentPackCards.forEach((_, idx) => {
                const el = document.getElementById(`packCard_${idx}`);
                if(el) el.classList.add('flipped');
            });
        }

        function renderDesk() {
            const desk = document.getElementById('deskArea');
            document.querySelectorAll('.table-card').forEach(el => el.remove());

            tableCards.forEach((c) => {
                const el = document.createElement('div');
                el.className = 'table-card';
                if(c.sleeve) el.classList.add('sleeve-effect');
                if(c.toploader) el.classList.add('toploader-effect');

                el.style.left = c.x + 'px';
                el.style.top = c.y + 'px';
                el.style.zIndex = c.zIndex;

                const menu = document.createElement('div');
                menu.className = 'card-menu';
                menu.innerHTML = `
                    <button onclick="toggleSleeve('${c.instanceId}')">✨슬리브</button>
                    <button onclick="toggleToploader('${c.instanceId}')">🛡️탑로더</button>
                    <button onclick="gradePSA('${c.instanceId}')">🔍PSA</button>
                `;
                el.appendChild(menu);

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-ui';
                imgDiv.style.backgroundImage = `url('${c.data.image}')`;
                el.appendChild(imgDiv);

                if(c.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${c.psa}`;
                    el.appendChild(badge);
                }

                el.onmousedown = (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    
                    c.zIndex = ++globalZIndex;
                    el.style.zIndex = c.zIndex;

                    let shiftX = e.clientX - el.getBoundingClientRect().left;
                    let shiftY = e.clientY - el.getBoundingClientRect().top;

                    function moveAt(pageX, pageY) {
                        let newX = pageX - shiftX - desk.getBoundingClientRect().left;
                        let newY = pageY - shiftY - desk.getBoundingClientRect().top;

                        newX = Math.max(0, Math.min(newX, desk.clientWidth - 110));
                        newY = Math.max(0, Math.min(newY, desk.clientHeight - 154));

                        el.style.left = newX + 'px';
                        el.style.top = newY + 'px';
                        c.x = newX; c.y = newY;
                    }

                    function onMouseMove(e) {
                        moveAt(e.pageX, e.pageY);
                    }

                    document.addEventListener('mousemove', onMouseMove);

                    document.onmouseup = function() {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.onmouseup = null;
                    };
                };

                el.ondblclick = () => {
                    binder.push({ ...c.data, sleeve: c.sleeve, toploader: c.toploader, psa: c.psa });
                    tableCards = tableCards.filter(tc => tc.instanceId !== c.instanceId);
                    saveUserData();
                    updateUI();
                    renderDesk();
                    alert("📘 카드가 수집 바인더에 저장되었습니다!");
                };

                desk.appendChild(el);
            });
        }

        function toggleSleeve(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) { card.sleeve = !card.sleeve; renderDesk(); }
        }
        function toggleToploader(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) { card.toploader = !card.toploader; renderDesk(); }
        }
        function gradePSA(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) {
                const grades = [8, 9, 9, 10, 10];
                card.psa = grades[Math.floor(Math.random() * grades.length)];
                alert(`🔍 PSA 감정 완료: [PSA ${card.psa}] 등급을 획득했습니다!`);
                renderDesk();
            }
        }

        function refreshTable() {
            if(confirm("테이블 위 카드를 모두 치우시겠습니까?")) {
                tableCards = [];
                renderDesk();
                document.getElementById('deskNotice').style.display = 'block';
            }
        }

        function renderBinder() {
            const grid = document.getElementById('binderGrid');
            grid.innerHTML = '';

            if(binder.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #aaa;">바인더가 비어있습니다.</p>`;
                return;
            }

            binder.forEach((card) => {
                const item = document.createElement('div');
                item.className = 'binder-card';
                if(card.sleeve) item.classList.add('sleeve-effect');
                if(card.toploader) item.classList.add('toploader-effect');

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-ui';
                imgDiv.style.backgroundImage = `url('${card.image}')`;
                imgDiv.style.width = '100%'; imgDiv.style.height = '100%';
                imgDiv.style.borderRadius = '8px';
                imgDiv.style.backgroundSize = 'cover';
                item.appendChild(imgDiv);

                if(card.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${card.psa}`;
                    item.appendChild(badge);
                }
                grid.appendChild(item);
            });
        }
    </script>
</body>
</html>
