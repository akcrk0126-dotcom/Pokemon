<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 TCG 전 시리즈 풀 컬렉션</title>
    <style>
        :root {
            --bg: #0b0d19;
            --panel: #16192b;
            --accent: #ffcb05;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header-bar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .gold-display { font-size: 1.3rem; font-weight: bold; color: var(--accent); }

        .nav-btns button {
            padding: 8px 16px;
            margin-left: 8px;
            border-radius: 8px;
            border: none;
            background: #232740;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btns button.active { background: var(--accent); color: black; }

        .view-section { display: none; width: 100%; max-width: 1100px; }
        .view-section.active { display: flex; flex-direction: column; align-items: center; }

        /* 모든 시리즈 선택 상점 구역 */
        .all-sets-panel {
            background: var(--panel);
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #232740;
        }

        .series-select {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            background: #0b0d19;
            color: var(--accent);
            border: 2px solid var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }

        .btn-buy {
            padding: 12px 30px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ffcb05, #e65c00);
            border: none;
            border-radius: 25px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 203, 5, 0.3);
        }

        /* 카드 넘기기 개봉 구역 */
        .pack-open-area {
            position: relative;
            width: 260px;
            height: 360px;
            margin-top: 30px;
            perspective: 1000px;
        }

        .card-stack {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: transform 0.4s ease-out, opacity 0.3s;
        }

        .card-stack.swipe-out {
            transform: translateX(120%) rotate(20deg) !important;
            opacity: 0;
        }

        .card-stack img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            pointer-events: none;
        }

        /* 슬리브/탑로더 존 */
        .accessory-zone {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .acc-item {
            width: 90px;
            height: 100px;
            border: 2px dashed var(--accent);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: grab;
            background: rgba(255,255,255,0.05);
            text-align: center;
        }

        .toploader-effect {
            border: 6px solid rgba(180, 220, 255, 0.9) !important;
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.9) !important;
            border-radius: 12px;
        }

        .sleeve-effect {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9) !important;
        }

        /* 바인더 */
        .binder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            background: #121526;
            padding: 20px;
            border-radius: 15px;
            min-height: 400px;
        }

        .binder-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #232740;
            background: #000;
        }

        .binder-card img { width: 100%; display: block; }
        
        .sell-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #e74c3c;
            border: none;
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .rarity-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
        }

        #statusText { margin-top: 15px; color: var(--accent); font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="gold-display">💰 <span id="goldCount">10000</span> Gold</div>
        <div class="nav-btns">
            <button id="btnNavShop" class="active" onclick="switchView('shop')">🏪 전 세대 상점</button>
            <button id="btnNavOpen" onclick="switchView('open')">🎴 팩 개봉</button>
            <button id="btnNavBinder" onclick="switchView('binder')">📘 내 바인더 (<span id="binderCount">0</span>)</button>
        </div>
    </div>

    <!-- 1. 모든 세트 선택 상점 -->
    <div id="viewShop" class="view-section active">
        <div class="all-sets-panel">
            <h2 style="color: var(--accent);">📦 원하는 포켓몬 카드 시리즈를 선택하세요</h2>
            <p style="color: #aaa; margin-top: 5px;">역대 모든 세트(Base Set부터 최신 확장팩까지)가 전부 등록되어 있습니다.</p>
            
            <select id="seriesSelect" class="series-select">
                <option value="">전체 시리즈 목록 불러오는 중...</option>
            </select>
            <br>
            <button class="btn-buy" onclick="buySelectedPack()">선택한 팩 구매하기 (1,000 Gold)</button>
        </div>
    </div>

    <!-- 2. 팩 개봉 뷰 -->
    <div id="viewOpen" class="view-section">
        <div id="statusText">상점에서 원하는 팩을 구매해주세요!</div>
        
        <div class="pack-open-area" id="packArea" onclick="swipeAndNext()"></div>

        <div class="accessory-zone" id="accZone" style="display:none;">
            <div class="acc-item" draggable="true" ondragstart="dragAcc(event, 'sleeve')">✨ 슬리브<br>(드래그)</div>
            <div class="acc-item" draggable="true" ondragstart="dragAcc(event, 'toploader')">🛡️ 탑로더<br>(드래그)</div>
        </div>
    </div>

    <!-- 3. 바인더 -->
    <div id="viewBinder" class="view-section">
        <h2 style="margin-bottom: 15px; color: var(--accent);">📘 내 포켓몬 카드 바인더</h2>
        <div class="binder-grid" id="binderGrid"></div>
    </div>

    <script>
        let gold = 10000;
        let binder = [];
        let setCache = {}; 
        let currentPackCards = [];
        let currentCardIndex = 0;
        let hasSleeve = false;
        let hasToploader = false;

        // 페이지 진입 시 역대 모든 세트 목록 한 번에 가져오기
        window.onload = async function() {
            try {
                const res = await fetch('https://api.pokemontcg.io/v2/sets');
                const data = await res.json();
                const select = document.getElementById('seriesSelect');
                select.innerHTML = '';

                // 세트 출시일 순 정렬
                const sets = data.data.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));

                sets.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `[${s.series}] ${s.name} (${s.total}장)`;
                    select.appendChild(opt);
                });
            } catch(e) {
                document.getElementById('seriesSelect').innerHTML = '<option>시리즈 목록을 불러오지 못했습니다.</option>';
            }
        };

        function updateUI() {
            document.getElementById('goldCount').textContent = gold.toLocaleString();
            document.getElementById('binderCount').textContent = binder.length;
        }

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));

            if(view === 'shop') {
                document.getElementById('viewShop').classList.add('active');
                document.getElementById('btnNavShop').classList.add('active');
            } else if(view === 'open') {
                document.getElementById('viewOpen').classList.add('active');
                document.getElementById('btnNavOpen').classList.add('active');
            } else if(view === 'binder') {
                document.getElementById('viewBinder').classList.add('active');
                document.getElementById('btnNavBinder').classList.add('active');
                renderBinder();
            }
        }

        // 캐싱 지원 카드 가져오기
        async function loadSetData(setId) {
            if (!setCache[setId]) {
                const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${setId}&pageSize=60`);
                const data = await res.json();
                setCache[setId] = data.data;
            }
            return setCache[setId];
        }

        // 팩 밸런스 배치 (마지막 장 피날레 레어)
        function buildBalancedPack(pool) {
            const commons = pool.filter(c => c.supertype === 'Energy' || c.rarity === 'Common');
            const uncommons = pool.filter(c => c.supertype === 'Trainer' || c.rarity === 'Uncommon');
            const rares = pool.filter(c => c.rarity && (c.rarity.includes('Rare') || c.rarity.includes('Promo') || c.rarity.includes('LEGEND')));

            const pack = [];
            const getRandom = (arr) => arr.length > 0 ? arr[Math.floor(Math.random() * arr.length)] : pool[Math.floor(Math.random() * pool.length)];

            for(let i=0; i<3; i++) pack.push(getRandom(commons));
            for(let i=0; i<3; i++) pack.push(getRandom(commons));
            for(let i=0; i<2; i++) pack.push(getRandom(uncommons));
            pack.push(getRandom(uncommons));
            pack.push(getRandom(rares)); // 맨 마지막 장 레어!

            return pack;
        }

        async function buySelectedPack() {
            const select = document.getElementById('seriesSelect');
            const setId = select.value;
            if(!setId) return;

            if (gold < 1000) {
                alert("골드가 부족합니다! 카드를 팔아서 모아보세요.");
                return;
            }

            gold -= 1000;
            updateUI();
            switchView('open');
            document.getElementById('statusText').textContent = "선택하신 시리즈 카드 데이터를 불러오는 중...";

            try {
                const pool = await loadSetData(setId);
                currentPackCards = buildBalancedPack(pool);
                currentCardIndex = 0;
                document.getElementById('accZone').style.display = 'flex';
                renderPackArea();
            } catch(e) {
                alert("카드 데이터를 불러오는 데 실패했습니다.");
            }
        }

        function renderPackArea() {
            const area = document.getElementById('packArea');
            area.innerHTML = '';

            if(currentCardIndex >= currentPackCards.length) {
                document.getElementById('statusText').textContent = "🎉 팩 개봉 완료! 바인더에 보관되었습니다.";
                document.getElementById('accZone').style.display = 'none';
                return;
            }

            const card = currentPackCards[currentCardIndex];
            
            if (currentCardIndex === 9) {
                document.getElementById('statusText').textContent = "🔥 [LAST!] 이번 팩의 피날레 레어 카드 등장!";
            } else {
                document.getElementById('statusText').textContent = `카드를 옆으로 날려보내세요 (${currentCardIndex + 1}/10)`;
            }

            const el = document.createElement('div');
            el.id = "activeCardStack";
            el.className = 'card-stack';
            if(hasSleeve) el.classList.add('sleeve-effect');
            if(hasToploader) el.classList.add('toploader-effect');

            el.ondragover = (e) => e.preventDefault();
            el.ondrop = (e) => dropAcc(e);

            const img = document.createElement('img');
            img.src = card.images.large || card.images.small;

            el.appendChild(img);
            area.appendChild(el);
        }

        function swipeAndNext() {
            if(currentPackCards.length === 0 || currentCardIndex >= currentPackCards.length) return;

            const el = document.getElementById('activeCardStack');
            if(el) {
                el.classList.add('swipe-out');
                setTimeout(() => {
                    const card = currentPackCards[currentCardIndex];
                    binder.push({
                        ...card,
                        sleeve: hasSleeve,
                        toploader: hasToploader
                    });

                    hasSleeve = false;
                    hasToploader = false;
                    currentCardIndex++;
                    renderPackArea();
                    updateUI();
                }, 250);
            }
        }

        function dragAcc(ev, type) { ev.dataTransfer.setData("type", type); }

        function dropAcc(ev) {
            ev.preventDefault();
            const type = ev.dataTransfer.getData("type");
            if(type === 'toploader') {
                hasToploader = true;
                alert("🛡️ 탑로더 장착 성공!");
            } else if(type === 'sleeve') {
                hasSleeve = true;
                alert("✨ 슬리브 씌우기 완료!");
            }
            renderPackArea();
        }

        function renderBinder() {
            const grid = document.getElementById('binderGrid');
            grid.innerHTML = '';

            if(binder.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">바인더가 비어있습니다.</p>';
                return;
            }

            binder.forEach((card, index) => {
                const item = document.createElement('div');
                item.className = 'binder-card';
                if(card.toploader) item.classList.add('toploader-effect');
                if(card.sleeve) item.classList.add('sleeve-effect');

                const isRare = card.rarity && (card.rarity.includes('Rare') || card.rarity.includes('Secret'));
                const price = isRare ? 1500 : 200;

                item.innerHTML = `
                    <span class="rarity-badge">${card.rarity || 'Common'}</span>
                    <img src="${card.images.small}" alt="${card.name}">
                    <button class="sell-btn" onclick="sellCard(${index}, ${price})">판매 (+${price}G)</button>
                `;
                grid.appendChild(item);
            });
        }

        function sellCard(index, price) {
            binder.splice(index, 1);
            gold += price;
            updateUI();
            renderBinder();
        }
    </script>
</body>
</html>
