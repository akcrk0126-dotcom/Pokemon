<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Simulator - Multi-Lang Fixed</title>
    <style>
        :root {
            --bg: #0b0d19;
            --panel: #16192b;
            --accent: #ffcb05;
            --text: #ffffff;
            --desk: #1e243d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: var(--panel); padding: 30px; border-radius: 15px;
            border: 2px solid var(--accent); width: 340px; text-align: center;
        }
        .auth-box input {
            width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;
            border: 1px solid #333; background: #0b0d19; color: #fff;
        }
        .auth-box button {
            width: 100%; padding: 10px; margin-top: 10px; background: var(--accent);
            border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color:#000;
        }

        .header-bar {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
            align-items: center; background: var(--panel); padding: 15px 25px; border-radius: 15px;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .gold-display { font-size: 1.1rem; font-weight: bold; color: var(--accent); display: flex; gap: 15px; align-items: center;}
        .pack-badge { font-size: 0.95rem; color: #4bcffa; background: #1a2744; padding: 4px 10px; border-radius: 20px; border: 1px solid #4bcffa; }

        .nav-btns button {
            padding: 8px 14px; margin-left: 3px; border-radius: 8px; border: none;
            background: #232740; color: white; font-weight: bold; cursor: pointer;
        }
        .nav-btns button.active { background: var(--accent); color: black; }

        .view-section { display: none; width: 100%; max-width: 1100px; }
        .view-section.active { display: flex; flex-direction: column; align-items: center; }

        .shop-panel {
            background: var(--panel); width: 100%; padding: 25px; border-radius: 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .lang-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .lang-btn {
            padding: 6px 14px; background: #0b0d19; border: 1px solid #444; color: #fff;
            border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
        }
        .lang-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .series-select {
            width: 100%; max-width: 650px; padding: 12px; background: #0b0d19;
            color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 15px; font-weight: bold;
        }
        
        .buy-options { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .shop-buy-box {
            display: flex; flex-direction: column; align-items: center; gap: 10px; background: #0b0d19; padding: 15px 20px; border-radius: 12px; border: 1px solid #333; min-width: 200px;
        }
        .shop-buy-box input {
            width: 70px; padding: 6px; text-align: center; background: #16192b; color: #fff; border: 1px solid var(--accent); border-radius: 6px; font-weight: bold;
        }

        .status-loading { font-size: 0.9rem; color: #4bcffa; margin-top: 8px; font-weight: bold; line-height: 1.4; }

        .desk-area {
            width: 100%; height: 480px; background: var(--desk); border: 2px dashed #38426b;
            border-radius: 15px; position: relative; overflow: hidden; margin-top: 10px;
        }

        .pack-open-stage {
            width: 100%; background: var(--panel); border-radius: 15px; padding: 25px;
            margin-top: 15px; display: flex; flex-direction: column; align-items: center; min-height: 420px;
            position: relative;
        }

        .pack-container { position: relative; width: 180px; height: 290px; cursor: pointer; perspective: 1000px; }

        .pack-body {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e2540 0%, #0a0d1a 100%);
            border: 2px solid var(--accent); border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255,203,5,0.2);
            overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 10px; transition: transform 0.2s;
        }
        .pack-container:hover .pack-body { transform: scale(1.03); }

        .pack-top-crimp, .pack-bottom-crimp {
            width: 100%; height: 16px;
            background: repeating-linear-gradient(90deg, #333, #333 3px, #111 3px, #111 6px);
        }

        .pack-art-img { width: 85%; height: 180px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }

        .pack-tearing { animation: packShake 0.4s ease-in-out infinite; }
        .pack-top-tear { animation: tearOff 0.6s forwards ease-in; }

        @keyframes packShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg) scale(1.02); }
            75% { transform: rotate(3deg) scale(1.02); }
            100% { transform: rotate(0deg); }
        }

        @keyframes tearOff {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) rotate(-20deg); opacity: 0; }
        }

        .stack-container { position: relative; width: 180px; height: 250px; margin-top: 10px; }

        .stacked-card {
            position: absolute; top: 0; left: 0; width: 180px; height: 250px;
            border-radius: 12px; background-size: cover; background-position: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: grab; touch-action: none;
            border: 2px solid rgba(255,255,255,0.2); background-color: #1a2744; transition: transform 0.15s;
        }
        .stacked-card:active { cursor: grabbing; }

        .table-card { position: absolute; width: 110px; height: 154px; cursor: grab; border-radius: 8px; touch-action: none; }
        .table-card:active { cursor: grabbing; }
        .table-card .card-ui { width: 100%; height: 100%; border-radius: 8px; background-size: cover; background-position: center; pointer-events: none; }

        .card-menu {
            position: absolute; top: -38px; left: 50%; transform: translateX(-50%);
            background: rgba(17,17,17,0.95); border: 1px solid var(--accent); border-radius: 6px; padding: 3px;
            display: none; gap: 4px; z-index: 99999; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .table-card:hover .card-menu { display: flex; }
        .card-menu button { background: #222; color: #fff; border: none; padding: 3px 6px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; }
        .card-menu button:hover { background: var(--accent); color: #000; }

        .sleeve-effect { box-shadow: 0 0 12px rgba(255, 255, 255, 0.9) !important; border: 2px solid #fff !important; }
        .toploader-effect { border: 4px solid #7ec8ff !important; box-shadow: 0 0 15px #0088ff !important; }
        .psa-badge {
            position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white;
            font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 8px; border: 1px solid white; z-index: 20;
        }
        .rarity-badge {
            position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.85); color: #ffcb05;
            font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 4px; border: 1px solid #ffcb05;
            max-width: 95px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .binder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; width: 100%; background: #121526; padding: 20px; border-radius: 15px; }
        .binder-card { position: relative; border-radius: 8px; width: 110px; height: 154px; }

        .btn-action { padding: 8px 16px; background: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: black; }
        .btn-action:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
        .action-controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2 style="color:var(--accent); margin-bottom:15px;">🎮 Pokémon TCG Simulator</h2>
            <input type="text" id="authId" placeholder="아이디 입력" value="Master">
            <input type="password" id="authPw" placeholder="비밀번호" value="1234">
            <p style="color:#2ed573; font-size:0.8rem; margin-top:8px; font-weight:bold;">✨ 일판/한판 100% 개봉 지원 패치 완료</p>
            <button onclick="handleAuth()">게임 시작하기</button>
        </div>
    </div>

    <div class="header-bar">
        <div>
            <span class="user-info">User: <b id="displayUserId" style="color:#fff;">-</b></span>
            <div class="gold-display">
                <span>💰 <span id="goldCount">100000</span> Gold</span>
                <span class="pack-badge">📦 Booster Packs: <b id="packInventoryCount">0</b></span>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
            <div class="nav-btns">
                <button id="btnNavShop" class="active" onclick="switchView('shop')">🏪 Booster Shop</button>
                <button id="btnNavOpen" onclick="switchView('open')">🎴 Unboxing Desk</button>
                <button id="btnNavBinder" onclick="switchView('binder')">📘 Collection Binder (<span id="binderCount">0</span>)</button>
                <button onclick="logout()" style="background:#e74c3c; color:white;">Logout</button>
            </div>
        </div>
    </div>

    <div id="viewShop" class="view-section active">
        <div class="shop-panel">
            <h2>⚡ Official Booster Shop</h2>
            <p style="color:#aaa; font-size:0.85rem; margin-top:5px; margin-bottom: 15px;">원하는 언어와 확장팩을 선택해 팩을 구매하세요!</p>

            <div class="lang-selector">
                <button class="lang-btn" onclick="changeLanguage('ko')" id="lang-ko">🇰🇷 한국어</button>
                <button class="lang-btn active" onclick="changeLanguage('en')" id="lang-en">🇺🇸 영어</button>
                <button class="lang-btn" onclick="changeLanguage('ja')" id="lang-ja">🇯🇵 일본어</button>
            </div>

            <select id="seriesSelect" class="series-select" onchange="loadSetData()"></select>
            <div id="loadStatus" class="status-loading">대기 중...</div>

            <div id="shopPackPreview" style="margin: 15px 0; min-height: 220px; display: flex; align-items: center; justify-content: center;">
                <div class="pack-container" style="cursor:default;">
                    <div class="pack-body">
                        <div class="pack-top-crimp"></div>
                        <img id="previewPackImg" src="" class="pack-art-img">
                        <div id="previewPackTitle" style="font-size:0.8rem; font-weight:bold; color:var(--accent); text-align:center;">Booster Pack</div>
                        <div class="pack-bottom-crimp"></div>
                    </div>
                </div>
            </div>

            <div class="buy-options">
                <div class="shop-buy-box">
                    <div style="font-weight:bold; color:#4bcffa;">🎈 팩 개별 구매</div>
                    <div>
                        <label>수량: </label>
                        <input type="number" id="buyPackCount" value="1" min="1" max="99">
                    </div>
                    <button class="btn-action" id="btnBuyPack" onclick="buyPacks()">팩 구매 (<span id="totalCost">1,000</span>G)</button>
                </div>

                <div class="shop-buy-box" style="border-color: var(--accent);">
                    <div style="font-weight:bold; color:var(--accent);">📦 부스터 박스 (30팩)</div>
                    <div style="font-size:0.8rem; color:#aaa;">10% 특별 할인 혜택!</div>
                    <button class="btn-action" id="btnBuyBox" onclick="buyBoosterBox()" style="background:#ff9f1a; color:white;">박스 구매 (27,000G)</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewOpen" class="view-section">
        <div class="open-container" style="width:100%;">
            <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                <p style="color:#aaa; font-size:0.85rem;">💡 카드를 더블클릭하면 바인더로 들어갑니다!</p>
                <button class="btn-action" style="background:#e74c3c; color:white; padding:6px 12px; font-size:0.85rem;" onclick="refreshTable()">🧹 테이블 초기화</button>
            </div>

            <div class="desk-area" id="deskArea">
                <p id="deskNotice" style="position:absolute; top:45%; width:100%; text-align:center; color:#667; pointer-events:none; font-size:0.9rem;">
                    💡 카드를 더블클릭하면 <b>Collection Binder</b>에 저장됩니다.
                </p>
            </div>

            <div class="pack-open-stage">
                <div id="packZone"></div>
                <div class="stack-container" id="stackContainer"></div>
                
                <div class="action-controls" id="nextActionZone" style="display:none;">
                    <button class="btn-action" id="btnNextPack" onclick="openNextPack()" style="background:#2ed573; color:white;">⚡ 바로 다음 팩 개봉</button>
                    <button class="btn-action" onclick="switchView('shop')" style="background:#57606f; color:white;">🏪 팩 선택 화면으로</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewBinder" class="view-section">
        <h2 style="margin-bottom: 15px; color: var(--accent);">📘 Collection Binder</h2>
        <div class="binder-grid" id="binderGrid"></div>
    </div>

    <script>
        let currentUser = null;
        let gold = 100000;
        let packInventory = 0;
        let binder = [];
        let currentPackCards = [];
        let tableCards = [];
        let globalZIndex = 100;

        let currentLang = 'en'; 
        let availableSets = [];
        let setCardsCache = {}; 
        let currentSetCards = { common: [], rare: [], ultra: [] };
        let currentSetInfo = null;

        window.onload = function() {
            document.getElementById('buyPackCount').addEventListener('input', (e) => {
                const count = Math.max(1, parseInt(e.target.value) || 1);
                document.getElementById('totalCost').textContent = (count * 1000).toLocaleString();
            });
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            setCardsCache = {}; 
            fetchSetsFromAPI();
        }

        async function fetchSetsFromAPI() {
            const statusEl = document.getElementById('loadStatus');
            statusEl.textContent = `🚀 [${currentLang.toUpperCase()}] 세트 목록을 받아오는 중...`;
            
            try {
                const res = await fetch(`https://api.tcgdex.net/v2/${currentLang}/sets`);
                if(!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();
                availableSets = data.filter(s => s.cardCount && (s.cardCount.total > 0 || s.cardCount.official > 0));
                
                const select = document.getElementById('seriesSelect');
                select.innerHTML = '';
                availableSets.forEach(s => {
                    const count = s.cardCount.official || s.cardCount.total || 0;
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `[${s.id.toUpperCase()}] ${s.name} (${count}장)`;
                    select.appendChild(opt);
                });

                statusEl.textContent = `✅ 총 ${availableSets.length}개 세트 준비 완료!`;
                loadSetData();
            } catch (err) {
                console.error("세트 로드 에러:", err);
                statusEl.innerHTML = `<span style="color:#ff4757;">❌ 네트워크 통신 오류가 발생했습니다.</span>`;
            }
        }

        async function loadSetData() {
            const selectEl = document.getElementById('seriesSelect');
            if(!selectEl.value) return;
            
            const setId = selectEl.value;
            const statusEl = document.getElementById('loadStatus');
            const buyBtn = document.getElementById('btnBuyPack');
            const buyBoxBtn = document.getElementById('btnBuyBox');

            currentSetInfo = availableSets.find(s => s.id === setId) || availableSets[0];
            
            // 이미지 폴백 로직 (로고 없으면 기본 포켓몬 심볼 처리)
            const logoUrl = currentSetInfo.logo ? `${currentSetInfo.logo}.png` : 'https://assets.tcgdex.net/univ/symbol.png';
            document.getElementById('previewPackImg').src = logoUrl;
            document.getElementById('previewPackTitle').textContent = currentSetInfo.name;

            if (setCardsCache[setId]) {
                currentSetCards = setCardsCache[setId];
                statusEl.textContent = `⚡ [준비 완료] ${currentSetInfo.name}`;
                buyBtn.disabled = false; buyBoxBtn.disabled = false;
                return;
            }

            statusEl.textContent = `⏳ [${currentSetInfo.name}] 카드 세트 불러오는 중...`;
            buyBtn.disabled = true; buyBoxBtn.disabled = true;

            try {
                const res = await fetch(`https://api.tcgdex.net/v2/${currentLang}/sets/${setId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                const rawCards = data.cards || [];

                if(rawCards.length === 0) throw new Error("카드 데이터가 비어 있습니다.");

                // 한판/일판 카드 이미지 누락 대응 (Fallback 이미지 주소 자동 구성)
                const validCards = rawCards.map(c => {
                    let imgPath = c.image ? `${c.image}/high.png` : `https://assets.tcgdex.net/${currentLang}/${currentSetInfo.id}/${c.localId || c.id}/high.png`;
                    return {
                        id: c.id,
                        name: c.name || 'Pokémon Card',
                        image: imgPath,
                        rarity: c.rarity || 'Common'
                    };
                });

                const commonList = [];
                const rareList = [];
                const ultraList = [];

                validCards.forEach(c => {
                    const r = (c.rarity || '').toLowerCase();
                    if (r.includes('ultra') || r.includes('secret') || r.includes('special') || r.includes('hyper') || r.includes('illustration') || r.includes('rr') || r.includes('sr') || r.includes('sar')) {
                        ultraList.push(c);
                    } else if (r.includes('rare') || r.includes('holo') || r.includes('r')) {
                        rareList.push(c);
                    } else {
                        commonList.push(c);
                    }
                });

                setCardsCache[setId] = {
                    common: commonList.length ? commonList : validCards,
                    rare: rareList.length ? rareList : validCards,
                    ultra: ultraList.length ? ultraList : (rareList.length ? rareList : validCards)
                };
                currentSetCards = setCardsCache[setId];

                statusEl.textContent = `✅ [${currentSetInfo.name}] 카드 세팅 완료!`;
                buyBtn.disabled = false; buyBoxBtn.disabled = false;
            } catch (err) {
                console.error("카드 로드 실패:", err);
                statusEl.innerHTML = `<span style="color:#ff4757;">⚠️ 해당 확장팩은 아직 서버에 데이터가 완전하지 않습니다. 다른 확장팩을 선택해 주세요.</span>`;
            }
        }

        function handleAuth() {
            const id = document.getElementById('authId').value.trim();
            if(!id) return alert("아이디를 입력해주세요!");
            currentUser = id;

            document.getElementById('displayUserId').textContent = id;
            document.getElementById('authOverlay').style.display = 'none';

            const users = JSON.parse(localStorage.getItem('tcg_free_v2') || '{}');
            if(!users[id]) users[id] = { gold: 100000, packInventory: 0, binder: [] };
            gold = users[id].gold || 100000;
            packInventory = users[id].packInventory || 0;
            binder = users[id].binder || [];
            updateUI();

            fetchSetsFromAPI();
        }

        function logout() { location.reload(); }

        function saveUserData() {
            if(!currentUser) return;
            const users = JSON.parse(localStorage.getItem('tcg_free_v2') || '{}');
            users[currentUser] = { gold: gold, packInventory: packInventory, binder: binder };
            localStorage.setItem('tcg_free_v2', JSON.stringify(users));
        }

        function updateUI() {
            document.getElementById('goldCount').textContent = gold.toLocaleString();
            document.getElementById('packInventoryCount').textContent = packInventory;
            document.getElementById('binderCount').textContent = binder.length;
        }

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
            if(view === 'shop') { 
                document.getElementById('viewShop').classList.add('active'); 
                document.getElementById('btnNavShop').classList.add('active'); 
            }
            else if(view === 'open') { 
                document.getElementById('viewOpen').classList.add('active'); 
                document.getElementById('btnNavOpen').classList.add('active'); 
                if(currentPackCards.length === 0) renderPackToOpen();
            }
            else if(view === 'binder') { 
                document.getElementById('viewBinder').classList.add('active'); 
                document.getElementById('btnNavBinder').classList.add('active'); 
                renderBinder(); 
            }
        }

        function buyPacks() {
            const count = Math.max(1, parseInt(document.getElementById('buyPackCount').value) || 1);
            const totalCost = count * 1000;

            if(gold < totalCost) return alert("Gold가 부족합니다!");
            
            gold -= totalCost;
            packInventory += count;
            saveUserData();
            updateUI();
            
            alert(`Booster Pack ${count}개 구매 완료!`);
            switchView('open');
            renderPackToOpen();
        }

        function buyBoosterBox() {
            const boxCost = 27000;
            if(gold < boxCost) return alert("Gold가 부족합니다!");

            gold -= boxCost;
            packInventory += 30;
            saveUserData();
            updateUI();

            alert(`📦 Booster Box (30팩) 구매 완료!`);
            switchView('open');
            renderPackToOpen();
        }

        function renderPackToOpen() {
            const packZone = document.getElementById('packZone');
            const stack = document.getElementById('stackContainer');
            document.getElementById('nextActionZone').style.display = 'none';
            stack.innerHTML = '';

            if (packInventory <= 0) {
                packZone.innerHTML = `<p style="color:#aaa;">보유한 Booster Pack이 없습니다. 상점에서 구매해 주세요.</p>`;
                return;
            }

            const logoImg = currentSetInfo.logo ? `${currentSetInfo.logo}.png` : 'https://assets.tcgdex.net/univ/symbol.png';

            packZone.innerHTML = `
                <div class="pack-container" id="interactivePack" onclick="triggerTearPack()">
                    <div class="pack-body" id="packBody">
                        <div class="pack-top-crimp" id="packTopCrimp"></div>
                        <img src="${logoImg}" class="pack-art-img">
                        <div style="font-size:0.85rem; color:var(--accent); font-weight:bold;">👉 CLICK TO OPEN</div>
                        <div class="pack-bottom-crimp"></div>
                    </div>
                </div>
            `;
        }

        function triggerTearPack() {
            if (packInventory <= 0) return;

            const packContainer = document.getElementById('interactivePack');
            const packBody = document.getElementById('packBody');
            const packTop = document.getElementById('packTopCrimp');

            packContainer.onclick = null; 
            packBody.classList.add('pack-tearing');
            packTop.classList.add('pack-top-tear');

            setTimeout(() => {
                packInventory--;
                saveUserData();
                updateUI();

                document.getElementById('packZone').innerHTML = `<p style="color:var(--accent); font-weight:bold;">✨ 개봉 완료! 카드를 옆으로 드래그해 보세요.</p>`;
                generatePackCards();
                renderCardStack();
            }, 600);
        }

        function generatePackCards() {
            currentPackCards = [];
            
            for(let i = 0; i < 4; i++) {
                const rand = Math.random();
                let picked = (rand < 0.85) ? getRandomFrom(currentSetCards.common) : getRandomFrom(currentSetCards.rare);
                currentPackCards.push(createCardInstance(picked));
            }

            const hitRand = Math.random();
            let hitCard = (hitRand < 0.70) ? getRandomFrom(currentSetCards.rare) : getRandomFrom(currentSetCards.ultra);
            currentPackCards.push(createCardInstance(hitCard));
        }

        function getRandomFrom(arr) {
            if(!arr || arr.length === 0) return { name: 'Pokémon Card', image: 'https://assets.tcgdex.net/univ/symbol.png', rarity: 'Common' };
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function createCardInstance(card) {
            return {
                instanceId: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                name: card.name,
                image: card.image,
                rarity: card.rarity
            };
        }

        function renderCardStack() {
            const container = document.getElementById('stackContainer');
            container.innerHTML = '';

            currentPackCards.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'stacked-card';
                cardEl.style.backgroundImage = `url('${card.image}')`;
                cardEl.style.zIndex = 50 - idx;
                cardEl.style.transform = `translate(${idx * 2}px, ${idx * 2}px)`;

                const rBadge = document.createElement('div');
                rBadge.className = 'rarity-badge';
                rBadge.textContent = card.rarity;
                cardEl.appendChild(rBadge);

                makeDraggableStackCard(cardEl, card, idx);
                container.appendChild(cardEl);
            });
        }

        function makeDraggableStackCard(el, cardData, initialIdx) {
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let dragging = false;

            const startDrag = (e) => {
                dragging = true;
                const pt = e.touches ? e.touches[0] : e;
                startX = pt.clientX; startY = pt.clientY;

                window.addEventListener('mousemove', moveDrag);
                window.addEventListener('touchmove', moveDrag, { passive: false });
                window.addEventListener('mouseup', endDrag);
                window.addEventListener('touchend', endDrag);
            };

            const moveDrag = (e) => {
                if (!dragging) return;
                const pt = e.touches ? e.touches[0] : e;
                currentX = pt.clientX - startX; currentY = pt.clientY - startY;
                el.style.transform = `translate(${initialIdx * 2 + currentX}px, ${initialIdx * 2 + currentY}px) rotate(${currentX * 0.08}deg)`;
            };

            const endDrag = () => {
                if (!dragging) return;
                dragging = false;

                window.removeEventListener('mousemove', moveDrag);
                window.removeEventListener('touchmove', moveDrag);
                window.removeEventListener('mouseup', endDrag);
                window.removeEventListener('touchend', endDrag);

                if (Math.abs(currentX) > 50 || Math.abs(currentY) > 50) {
                    el.style.transition = 'all 0.2s ease-out';
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.remove();
                        sendCardToDesk(cardData);
                        checkStackEmpty();
                    }, 150);
                } else {
                    el.style.transition = 'transform 0.2s';
                    el.style.transform = `translate(${initialIdx * 2}px, ${initialIdx * 2}px)`;
                    setTimeout(() => el.style.transition = '', 200);
                }
            };

            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: false });
        }

        function checkStackEmpty() {
            const container = document.getElementById('stackContainer');
            if (container.children.length === 0) {
                const nextBtn = document.getElementById('btnNextPack');
                document.getElementById('nextActionZone').style.display = 'flex';
                if(packInventory > 0) {
                    nextBtn.innerText = `⚡ 바로 다음 팩 개봉 (남은 팩: ${packInventory}개)`;
                } else {
                    nextBtn.innerText = `모든 팩 개봉 완료!`;
                }
            }
        }

        function sendCardToDesk(cardData) {
            document.getElementById('deskNotice').style.display = 'none';
            const offset = (tableCards.length * 20) % 200;

            const cardObj = {
                instanceId: cardData.instanceId,
                data: cardData,
                sleeve: false,
                toploader: false,
                psa: null,
                x: 30 + offset,
                y: 30 + (offset / 2),
                zIndex: ++globalZIndex
            };

            tableCards.push(cardObj);
            renderDesk();
        }

        function openNextPack() {
            if(packInventory <= 0) {
                alert("보유한 팩이 없습니다!");
                switchView('shop');
                return;
            }
            renderPackToOpen();
        }

        function renderDesk() {
            const desk = document.getElementById('deskArea');
            document.querySelectorAll('.table-card').forEach(el => el.remove());

            tableCards.forEach((c) => {
                const el = document.createElement('div');
                el.className = 'table-card';
                if(c.sleeve) el.classList.add('sleeve-effect');
                if(c.toploader) el.classList.add('toploader-effect');

                el.style.left = c.x + 'px';
                el.style.top = c.y + 'px';
                el.style.zIndex = c.zIndex;

                const menu = document.createElement('div');
                menu.className = 'card-menu';
                menu.innerHTML = `
                    <button onclick="toggleSleeve('${c.instanceId}')">✨슬리브</button>
                    <button onclick="toggleToploader('${c.instanceId}')">🛡️탑로더</button>
                    <button onclick="gradePSA('${c.instanceId}')">🔍PSA</button>
                `;
                el.appendChild(menu);

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-ui';
                imgDiv.style.backgroundImage = `url('${c.data.image}')`;
                
                const rBadge = document.createElement('div');
                rBadge.className = 'rarity-badge';
                rBadge.textContent = c.data.rarity;
                imgDiv.appendChild(rBadge);

                el.appendChild(imgDiv);

                if(c.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${c.psa}`;
                    el.appendChild(badge);
                }

                let dragging = false;
                let shiftX = 0, shiftY = 0;

                const startMove = (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    dragging = true;
                    c.zIndex = ++globalZIndex;
                    el.style.zIndex = c.zIndex;

                    const pt = e.touches ? e.touches[0] : e;
                    const rect = el.getBoundingClientRect();
                    shiftX = pt.clientX - rect.left;
                    shiftY = pt.clientY - rect.top;

                    window.addEventListener('mousemove', moveCard);
                    window.addEventListener('touchmove', moveCard, { passive: false });
                    window.addEventListener('mouseup', stopMove);
                    window.addEventListener('touchend', stopMove);
                };

                const moveCard = (e) => {
                    if (!dragging) return;
                    const pt = e.touches ? e.touches[0] : e;
                    const deskRect = desk.getBoundingClientRect();

                    let newX = pt.clientX - shiftX - deskRect.left;
                    let newY = pt.clientY - shiftY - deskRect.top;

                    newX = Math.max(0, Math.min(newX, desk.clientWidth - 110));
                    newY = Math.max(0, Math.min(newY, desk.clientHeight - 154));

                    el.style.left = newX + 'px';
                    el.style.top = newY + 'px';
                    c.x = newX; c.y = newY;
                };

                const stopMove = () => {
                    dragging = false;
                    window.removeEventListener('mousemove', moveCard);
                    window.removeEventListener('touchmove', moveCard);
                    window.removeEventListener('mouseup', stopMove);
                    window.removeEventListener('touchend', stopMove);
                };

                el.addEventListener('mousedown', startMove);
                el.addEventListener('touchstart', startMove, { passive: false });

                el.ondblclick = () => {
                    binder.push({ ...c.data, sleeve: c.sleeve, toploader: c.toploader, psa: c.psa });
                    tableCards = tableCards.filter(tc => tc.instanceId !== c.instanceId);
                    saveUserData();
                    updateUI();
                    renderDesk();
                    alert("📘 카드가 바인더에 추가되었습니다!");
                };

                desk.appendChild(el);
            });
        }

        function toggleSleeve(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) { card.sleeve = !card.sleeve; renderDesk(); }
        }
        function toggleToploader(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) { card.toploader = !card.toploader; renderDesk(); }
        }
        function gradePSA(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) {
                const grades = [8, 9, 9, 10, 10];
                card.psa = grades[Math.floor(Math.random() * grades.length)];
                alert(`🔍 PSA 등급 평가 완료: [PSA ${card.psa}]`);
                renderDesk();
            }
        }

        function refreshTable() {
            if(confirm("테이블 위 카드를 정리하시겠습니까?")) {
                tableCards = [];
                renderDesk();
                document.getElementById('deskNotice').style.display = 'block';
            }
        }

        function renderBinder() {
            const grid = document.getElementById('binderGrid');
            grid.innerHTML = '';

            if(binder.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #aaa;">바인더가 비어있습니다.</p>`;
                return;
            }

            binder.forEach((card) => {
                const item = document.createElement('div');
                item.className = 'binder-card';
                if(card.sleeve) item.classList.add('sleeve-effect');
                if(card.toploader) item.classList.add('toploader-effect');

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-ui';
                imgDiv.style.backgroundImage = `url('${card.image}')`;
                imgDiv.style.width = '100%'; imgDiv.style.height = '100%';
                imgDiv.style.borderRadius = '8px';
                imgDiv.style.backgroundSize = 'cover';

                const rBadge = document.createElement('div');
                rBadge.className = 'rarity-badge';
                rBadge.textContent = card.rarity;
                imgDiv.appendChild(rBadge);

                item.appendChild(imgDiv);

                if(card.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${card.psa}`;
                    item.appendChild(badge);
                }
                grid.appendChild(item);
            });
        }
    </script>
</body>
</html>
