<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 TCG 시뮬레이터 - 100만원 실거래 시세 완벽판</title>
    <style>
        :root {
            --bg: #0b0d19;
            --panel: #16192b;
            --accent: #ffcb05;
            --text: #ffffff;
            --desk: #1e243d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: var(--panel); padding: 30px; border-radius: 15px;
            border: 2px solid var(--accent); width: 350px; text-align: center;
        }
        .auth-box input {
            width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;
            border: 1px solid #333; background: #0b0d19; color: #fff;
        }
        .auth-box button {
            width: 100%; padding: 10px; margin-top: 10px; background: var(--accent);
            border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color:#000;
        }

        .header-bar {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
            align-items: center; background: var(--panel); padding: 15px 25px; border-radius: 15px;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .gold-display { font-size: 1.15rem; font-weight: bold; color: var(--accent); display: flex; gap: 15px; align-items: center;}
        .pack-badge { font-size: 0.9rem; color: #4bcffa; background: #1a2744; padding: 4px 10px; border-radius: 20px; border: 1px solid #4bcffa; }

        .nav-btns button {
            padding: 8px 14px; margin-left: 3px; border-radius: 8px; border: none;
            background: #232740; color: white; font-weight: bold; cursor: pointer;
        }
        .nav-btns button.active { background: var(--accent); color: black; }

        .view-section { display: none; width: 100%; max-width: 1100px; }
        .view-section.active { display: flex; flex-direction: column; align-items: center; }

        .shop-panel {
            background: var(--panel); width: 100%; padding: 25px; border-radius: 15px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .series-select {
            width: 100%; max-width: 650px; padding: 12px; background: #0b0d19;
            color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 15px; font-weight: bold;
        }
        
        .buy-options { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .shop-buy-box {
            display: flex; flex-direction: column; align-items: center; gap: 10px; background: #0b0d19; padding: 15px 20px; border-radius: 12px; border: 1px solid #333; min-width: 220px;
        }
        .shop-buy-box input {
            width: 70px; padding: 6px; text-align: center; background: #16192b; color: #fff; border: 1px solid var(--accent); border-radius: 6px; font-weight: bold;
        }

        .desk-area {
            width: 100%; height: 480px; background: var(--desk); border: 2px dashed #38426b;
            border-radius: 15px; position: relative; overflow: hidden; margin-top: 10px;
        }

        .pack-open-stage {
            width: 100%; background: var(--panel); border-radius: 15px; padding: 25px;
            margin-top: 15px; display: flex; flex-direction: column; align-items: center; min-height: 420px;
            position: relative;
        }

        .pack-container { position: relative; width: 180px; height: 290px; cursor: pointer; perspective: 1000px; }

        .pack-body {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e2540 0%, #0a0d1a 100%);
            border: 2px solid var(--accent); border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255,203,5,0.2);
            overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 8px; transition: transform 0.2s;
        }
        .pack-container:hover .pack-body { transform: scale(1.03); }

        .pack-top-crimp, .pack-bottom-crimp {
            width: 100%; height: 16px;
            background: repeating-linear-gradient(90deg, #333, #333 3px, #111 3px, #111 6px);
            z-index: 5;
        }

        .pack-art-img {
            width: 90%; height: 200px; object-fit: contain;
            filter: drop-shadow(0 5px 12px rgba(0,0,0,0.7));
            margin: auto 0;
        }

        .pack-tearing { animation: packShake 0.4s ease-in-out infinite; }
        .pack-top-tear { animation: tearOff 0.6s forwards ease-in; }

        @keyframes packShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg) scale(1.02); }
            75% { transform: rotate(3deg) scale(1.02); }
            100% { transform: rotate(0deg); }
        }

        @keyframes tearOff {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) rotate(-20deg); opacity: 0; }
        }

        .stack-container { position: relative; width: 180px; height: 250px; margin-top: 10px; }

        .stacked-card {
            position: absolute; top: 0; left: 0; width: 180px; height: 250px;
            border-radius: 12px; background-size: cover; background-position: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: grab; touch-action: none;
            border: 2px solid rgba(255,255,255,0.2); background-color: #1a2744; transition: transform 0.15s;
        }
        .stacked-card:active { cursor: grabbing; }

        .table-card { position: absolute; width: 110px; height: 154px; cursor: grab; border-radius: 8px; touch-action: none; }
        .table-card:active { cursor: grabbing; }
        .table-card .card-ui { width: 100%; height: 100%; border-radius: 8px; background-size: cover; background-position: center; pointer-events: none; }

        .card-menu {
            position: absolute; top: -38px; left: 50%; transform: translateX(-50%);
            background: rgba(17,17,17,0.95); border: 1px solid var(--accent); border-radius: 6px; padding: 3px;
            display: none; gap: 4px; z-index: 99999; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .table-card:hover .card-menu { display: flex; }
        .card-menu button, .binder-btn-group button { 
            background: #222; color: #fff; border: none; padding: 3px 6px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; 
        }
        .card-menu button:hover, .binder-btn-group button:hover { background: var(--accent); color: #000; }
        .card-menu button.sell-btn, .binder-btn-group button.sell-btn { background: #e74c3c; font-weight: bold; color: white; }
        .card-menu button.sell-btn:hover, .binder-btn-group button.sell-btn:hover { background: #ff4757; }

        .sleeve-effect { box-shadow: 0 0 12px rgba(255, 255, 255, 0.9) !important; border: 2px solid #fff !important; }
        .toploader-effect { border: 4px solid #7ec8ff !important; box-shadow: 0 0 15px #0088ff !important; }
        .psa-badge {
            position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white;
            font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 8px; border: 1px solid white; z-index: 20;
        }
        
        .rarity-badge {
            position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.85); color: #ffcb05;
            font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffcb05;
            box-shadow: 0 2px 5px rgba(0,0,0,0.8); letter-spacing: 0.5px;
        }
        .rarity-badge.rare-sar, .rarity-badge.rare-ur, .rarity-badge.rare-sr {
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            color: #fff; border-color: #fff; text-shadow: 0 1px 2px #000;
        }
        .rarity-badge.rare-ar, .rarity-badge.rare-rr {
            background: #1e90ff; color: #fff; border-color: #70a1ff;
        }

        .market-price-tag {
            font-size: 0.75rem; font-weight: bold; text-align: center; margin-top: 4px; color: #2ed573;
        }

        .binder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 35px 15px; width: 100%; background: #121526; padding: 20px; border-radius: 15px; }
        .binder-card-wrapper { display: flex; flex-direction: column; align-items: center; }
        .binder-card { position: relative; border-radius: 8px; width: 110px; height: 154px; }
        
        .binder-btn-group {
            display: flex; flex-direction: column; gap: 3px; width: 110px; margin-top: 6px;
        }
        .binder-btn-group button { width: 100%; font-size: 0.68rem; padding: 3px 0; }

        .btn-action { padding: 8px 16px; background: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: black; }
        .btn-action:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
        .action-controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2 style="color:var(--accent); margin-bottom:10px;">🎮 Pokémon TCG Simulator</h2>
            <p style="color:#aaa; font-size:0.8rem; margin-bottom:15px;">실제 시세 완벽 연동 버전</p>
            <input type="text" id="authId" placeholder="유저 ID" value="Master">
            <input type="password" id="authPw" placeholder="비밀번호" value="1234">
            <p style="color:#2ed573; font-size:0.85rem; margin-top:8px; font-weight:bold;">💰 시작 자본: 1,000,000원</p>
            <button onclick="handleAuth()">시작하기</button>
        </div>
    </div>

    <div class="header-bar">
        <div>
            <span class="user-info">트레이너: <b id="displayUserId" style="color:#fff;">-</b></span>
            <div class="gold-display">
                <span>💰 소지금: <span id="goldCount">1,000,000</span>원</span>
                <span class="pack-badge">📦 보유 팩: <b id="packInventoryCount">0</b>개</span>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
            <div class="nav-btns">
                <button id="btnNavShop" class="active" onclick="switchView('shop')">🏪 부스터 샵</button>
                <button id="btnNavOpen" onclick="switchView('open')">🎴 개봉 책상</button>
                <button id="btnNavBinder" onclick="switchView('binder')">📘 수집 바인더 (<span id="binderCount">0</span>)</button>
                <button onclick="logout()" style="background:#e74c3c; color:white;">로그아웃</button>
            </div>
        </div>
    </div>

    <div id="viewShop" class="view-section active">
        <div class="shop-panel">
            <h2>⚡ 공식 확장팩 상점</h2>
            <p style="color:#aaa; font-size:0.85rem; margin-top:5px; margin-bottom: 15px;">원하는 시리즈를 선택해 팩 또는 박스로 구매하세요!</p>

            <select id="seriesSelect" class="series-select" onchange="loadSetData()"></select>

            <div id="shopPackPreview" style="margin: 15px 0; min-height: 220px; display: flex; align-items: center; justify-content: center;">
                <div class="pack-container" style="cursor:default;">
                    <div class="pack-body">
                        <div class="pack-top-crimp"></div>
                        <img id="previewPackImg" src="" class="pack-art-img">
                        <div id="previewPackTitle" style="font-size:0.85rem; font-weight:bold; color:var(--accent); text-align:center;">부스터 팩</div>
                        <div class="pack-bottom-crimp"></div>
                    </div>
                </div>
            </div>

            <div class="buy-options">
                <div class="shop-buy-box">
                    <div style="font-weight:bold; color:#4bcffa;">🎈 개별 팩 구매</div>
                    <div style="font-size:0.8rem; color:#aaa;">팩당 단가: <span id="singlePackPrice">1,700</span>원</div>
                    <div>
                        <label>수량: </label>
                        <input type="number" id="buyPackCount" value="1" min="1" max="99">
                    </div>
                    <button class="btn-action" id="btnBuyPack" onclick="buyPacks()">구입 (<span id="totalCost">1,700</span>원)</button>
                </div>

                <div class="shop-buy-box" style="border-color: var(--accent);">
                    <div style="font-weight:bold; color:var(--accent);">📦 1보스 박스 (30팩)</div>
                    <div style="font-size:0.8rem; color:#aaa;">박스 시세: <span id="boxPriceDisplay">50,000</span>원</div>
                    <button class="btn-action" id="btnBuyBox" onclick="buyBoosterBox()" style="background:#ff9f1a; color:white;">박스 구입하기</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewOpen" class="view-section">
        <div class="open-container" style="width:100%;">
            <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                <p style="color:#aaa; font-size:0.85rem;">💡 카드를 더블클릭하면 <b>수집 바인더</b>로 저장됩니다.</p>
                <button class="btn-action" style="background:#e74c3c; color:white; padding:6px 12px; font-size:0.85rem;" onclick="refreshTable()">🧹 책상 정리</button>
            </div>

            <div class="desk-area" id="deskArea">
                <p id="deskNotice" style="position:absolute; top:45%; width:100%; text-align:center; color:#667; pointer-events:none; font-size:0.9rem;">
                    💡 카드를 더블 클릭하여 바인더에 보관해 보세요.
                </p>
            </div>

            <div class="pack-open-stage">
                <div id="packZone"></div>
                <div class="stack-container" id="stackContainer"></div>
                
                <div class="action-controls" id="nextActionZone" style="display:none;">
                    <button class="btn-action" id="btnNextPack" onclick="openNextPack()" style="background:#2ed573; color:white;">⚡ 다음 팩 뜯기</button>
                    <button class="btn-action" onclick="switchView('shop')" style="background:#57606f; color:white;">🏪 상점으로 돌아가기</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewBinder" class="view-section">
        <h2 style="margin-bottom: 15px; color: var(--accent);">📘 수집 바인더</h2>
        <div class="binder-grid" id="binderGrid"></div>
    </div>

    <script>
        // 🔒 외부 네트워크 없이도 100% 동작하는 고화질 자체 포켓몬 데이터베이스
        const GAME_DATABASE = {
            "sv151": {
                id: "sv151",
                name: "포켓몬 카드 151 (프리미엄 팩)",
                packPrice: 3200,
                boxPrice: 95000,
                packArt: "https://images.pokemontcg.io/sv3pt5/symbol.png",
                cards: [
                    { name: "뮤 EX (SAR)", rarity: "SAR", basePrice: 125000, image: "https://images.pokemontcg.io/sv3pt5/205_hires.png" },
                    { name: "리자몽 EX (SAR)", rarity: "SAR", basePrice: 180000, image: "https://images.pokemontcg.io/sv3pt5/199_hires.png" },
                    { name: "피카츄 (AR)", rarity: "AR", basePrice: 28000, image: "https://images.pokemontcg.io/sv3pt5/173_hires.png" },
                    { name: "거북왕 EX (SR)", rarity: "SR", basePrice: 42000, image: "https://images.pokemontcg.io/sv3pt5/184_hires.png" },
                    { name: "이상해꽃 EX (RR)", rarity: "RR", basePrice: 6500, image: "https://images.pokemontcg.io/sv3pt5/3_hires.png" },
                    { name: "파이리", rarity: "C", basePrice: 500, image: "https://images.pokemontcg.io/sv3pt5/4_hires.png" },
                    { name: "꼬부기", rarity: "C", basePrice: 500, image: "https://images.pokemontcg.io/sv3pt5/7_hires.png" },
                    { name: "이상해씨", rarity: "C", basePrice: 500, image: "https://images.pokemontcg.io/sv3pt5/1_hires.png" }
                ]
            },
            "sv4a": {
                id: "sv4a",
                name: "샤이니트레저 ex (하이클래스 팩)",
                packPrice: 3000,
                boxPrice: 88000,
                packArt: "https://images.pokemontcg.io/sv4pt5/symbol.png",
                cards: [
                    { name: "이로치 리자몽 EX (SAR)", rarity: "SAR", basePrice: 165000, image: "https://images.pokemontcg.io/sv4pt5/234_hires.png" },
                    { name: "이로치 피카츄 (S)", rarity: "AR", basePrice: 35000, image: "https://images.pokemontcg.io/sv4pt5/231_hires.png" },
                    { name: "가디안 EX (SAR)", rarity: "SAR", basePrice: 85000, image: "https://images.pokemontcg.io/sv4pt5/233_hires.png" },
                    { name: "네오라이트 EX (RR)", rarity: "RR", basePrice: 4500, image: "https://images.pokemontcg.io/sv4pt5/62_hires.png" },
                    { name: "모란 (SR)", rarity: "SR", basePrice: 38000, image: "https://images.pokemontcg.io/sv4pt5/228_hires.png" },
                    { name: "뜨아거", rarity: "C", basePrice: 400, image: "https://images.pokemontcg.io/sv4pt5/28_hires.png" },
                    { name: "나오하", rarity: "C", basePrice: 400, image: "https://images.pokemontcg.io/sv4pt5/14_hires.png" }
                ]
            },
            "sv1S": {
                id: "sv1S",
                name: "스칼렛ex (정규 확장팩)",
                packPrice: 1700,
                boxPrice: 50000,
                packArt: "https://images.pokemontcg.io/sv1/symbol.png",
                cards: [
                    { name: "코라이돈 EX (UR)", rarity: "UR", basePrice: 110000, image: "https://images.pokemontcg.io/sv1/254_hires.png" },
                    { name: "가디안 EX (SAR)", rarity: "SAR", basePrice: 92000, image: "https://images.pokemontcg.io/sv1/245_hires.png" },
                    { name: "위유이 EX (SR)", rarity: "SR", basePrice: 28000, image: "https://images.pokemontcg.io/sv1/233_hires.png" },
                    { name: "코라이돈 EX (RR)", rarity: "RR", basePrice: 5000, image: "https://images.pokemontcg.io/sv1/125_hires.png" },
                    { name: "랄토스 (AR)", rarity: "AR", basePrice: 15000, image: "https://images.pokemontcg.io/sv1/211_hires.png" },
                    { name: "빠모", rarity: "C", basePrice: 300, image: "https://images.pokemontcg.io/sv1/73_hires.png" },
                    { name: "맛이차", rarity: "C", basePrice: 300, image: "https://images.pokemontcg.io/sv1/21_hires.png" }
                ]
            }
        };

        let currentUser = null;
        let gold = 1000000; // 💰 시작 자본 1,000,000원
        let packInventory = 0;
        let binder = [];
        let tableCards = [];
        let globalZIndex = 100;

        let currentSetData = null;
        let currentPackCards = [];

        window.onload = function() {
            document.getElementById('buyPackCount').addEventListener('input', (e) => {
                const count = Math.max(1, parseInt(e.target.value) || 1);
                document.getElementById('totalCost').textContent = (count * currentSetData.packPrice).toLocaleString();
            });
        };

        function initDatabase() {
            const select = document.getElementById('seriesSelect');
            select.innerHTML = '';
            
            Object.keys(GAME_DATABASE).forEach(key => {
                const set = GAME_DATABASE[key];
                const opt = document.createElement('option');
                opt.value = set.id;
                opt.textContent = `[공식] ${set.name}`;
                select.appendChild(opt);
            });

            loadSetData();
        }

        function loadSetData() {
            const setId = document.getElementById('seriesSelect').value;
            currentSetData = GAME_DATABASE[setId] || GAME_DATABASE["sv151"];

            document.getElementById('singlePackPrice').textContent = currentSetData.packPrice.toLocaleString();
            document.getElementById('boxPriceDisplay').textContent = currentSetData.boxPrice.toLocaleString();
            
            const count = Math.max(1, parseInt(document.getElementById('buyPackCount').value) || 1);
            document.getElementById('totalCost').textContent = (count * currentSetData.packPrice).toLocaleString();

            document.getElementById('previewPackImg').src = currentSetData.cards[0].image;
            document.getElementById('previewPackTitle').textContent = currentSetData.name;
        }

        function getLiveMarketPrice(card) {
            let base = card.basePrice || 1000;
            const trend = 1 + (card.marketTrend || 0);
            let finalPrice = base * trend;

            if (card.psa === 10) finalPrice *= 2.5;
            else if (card.psa === 9) finalPrice *= 1.6;
            else if (card.psa === 8) finalPrice *= 1.2;

            return Math.floor(finalPrice);
        }

        function handleAuth() {
            const id = document.getElementById('authId').value.trim();
            if(!id) return alert("유저 ID를 입력하세요!");
            currentUser = id;

            document.getElementById('displayUserId').textContent = id;
            document.getElementById('authOverlay').style.display = 'none';

            const users = JSON.parse(localStorage.getItem('tcg_stable_v3') || '{}');
            if(!users[id]) users[id] = { gold: 1000000, packInventory: 0, binder: [] };
            gold = users[id].gold !== undefined ? users[id].gold : 1000000;
            packInventory = users[id].packInventory || 0;
            binder = users[id].binder || [];
            updateUI();

            initDatabase();
        }

        function logout() { location.reload(); }

        function saveUserData() {
            if(!currentUser) return;
            const users = JSON.parse(localStorage.getItem('tcg_stable_v3') || '{}');
            users[currentUser] = { gold: gold, packInventory: packInventory, binder: binder };
            localStorage.setItem('tcg_stable_v3', JSON.stringify(users));
        }

        function updateUI() {
            document.getElementById('goldCount').textContent = gold.toLocaleString();
            document.getElementById('packInventoryCount').textContent = packInventory;
            document.getElementById('binderCount').textContent = binder.length;
        }

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
            if(view === 'shop') { 
                document.getElementById('viewShop').classList.add('active'); 
                document.getElementById('btnNavShop').classList.add('active'); 
            }
            else if(view === 'open') { 
                document.getElementById('viewOpen').classList.add('active'); 
                document.getElementById('btnNavOpen').classList.add('active'); 
                if(currentPackCards.length === 0) renderPackToOpen();
            }
            else if(view === 'binder') { 
                document.getElementById('viewBinder').classList.add('active'); 
                document.getElementById('btnNavBinder').classList.add('active'); 
                renderBinder(); 
            }
        }

        function buyPacks() {
            const count = Math.max(1, parseInt(document.getElementById('buyPackCount').value) || 1);
            const totalCost = count * currentSetData.packPrice;

            if(gold < totalCost) return alert("잔액이 부족합니다!");
            
            gold -= totalCost;
            packInventory += count;
            saveUserData();
            updateUI();
            
            alert(`부스터 팩 ${count}개를 구매했습니다! (-${totalCost.toLocaleString()}원)`);
            switchView('open');
            renderPackToOpen();
        }

        function buyBoosterBox() {
            if(gold < currentSetData.boxPrice) return alert("잔액이 부족합니다!");

            gold -= currentSetData.boxPrice;
            packInventory += 30;
            saveUserData();
            updateUI();

            alert(`📦 1보스 박스(30팩)를 구매했습니다! (-${currentSetData.boxPrice.toLocaleString()}원)`);
            switchView('open');
            renderPackToOpen();
        }

        function renderPackToOpen() {
            const packZone = document.getElementById('packZone');
            const stack = document.getElementById('stackContainer');
            document.getElementById('nextActionZone').style.display = 'none';
            stack.innerHTML = '';

            if (packInventory <= 0) {
                packZone.innerHTML = `<p style="color:#aaa;">개봉할 팩이 없습니다. 상점에서 팩을 구매해 보세요.</p>`;
                return;
            }

            packZone.innerHTML = `
                <div class="pack-container" id="interactivePack" onclick="triggerTearPack()">
                    <div class="pack-body" id="packBody">
                        <div class="pack-top-crimp" id="packTopCrimp"></div>
                        <img src="${currentSetData.cards[0].image}" class="pack-art-img">
                        <div style="font-size:0.85rem; color:var(--accent); font-weight:bold;">👉 클릭하여 팩 개봉</div>
                        <div class="pack-bottom-crimp"></div>
                    </div>
                </div>
            `;
        }

        function triggerTearPack() {
            if (packInventory <= 0) return;

            const packContainer = document.getElementById('interactivePack');
            const packBody = document.getElementById('packBody');
            const packTop = document.getElementById('packTopCrimp');

            packContainer.onclick = null; 
            packBody.classList.add('pack-tearing');
            packTop.classList.add('pack-top-tear');

            setTimeout(() => {
                packInventory--;
                saveUserData();
                updateUI();

                document.getElementById('packZone').innerHTML = `<p style="color:var(--accent); font-weight:bold;">✨ 개봉 완료! 카드를 드래그하여 넘겨보세요.</p>`;
                generatePackCards();
                renderCardStack();
            }, 600);
        }

        function generatePackCards() {
            currentPackCards = [];
            const cardPool = currentSetData.cards;
            
            for(let i = 0; i < 4; i++) {
                const commonCards = cardPool.filter(c => c.rarity === 'C' || c.rarity === 'RR');
                const picked = commonCards[Math.floor(Math.random() * commonCards.length)] || cardPool[0];
                currentPackCards.push(createCardInstance(picked));
            }

            const rareCards = cardPool.filter(c => ['SAR', 'SR', 'AR', 'UR'].includes(c.rarity));
            const hitCard = rareCards[Math.floor(Math.random() * rareCards.length)] || cardPool[0];
            currentPackCards.push(createCardInstance(hitCard));
        }

        function createCardInstance(card) {
            const randomTrend = (Math.random() * 0.2 - 0.05).toFixed(2);
            return {
                instanceId: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                name: card.name,
                image: card.image,
                rarity: card.rarity,
                basePrice: card.basePrice,
                marketTrend: parseFloat(randomTrend)
            };
        }

        function getRarityBadgeClass(rarity) {
            const r = String(rarity).toUpperCase();
            if (['SAR', 'SR', 'UR'].includes(r)) return 'rare-sar';
            if (['AR', 'RR'].includes(r)) return 'rare-ar';
            return '';
        }

        function renderCardStack() {
            const container = document.getElementById('stackContainer');
            container.innerHTML = '';

            currentPackCards.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'stacked-card';
                cardEl.style.backgroundImage = `url('${card.image}')`;
                cardEl.style.zIndex = 50 - idx;
                cardEl.style.transform = `translate(${idx * 2}px, ${idx * 2}px)`;

                const rBadge = document.createElement('div');
                rBadge.className = `rarity-badge ${getRarityBadgeClass(card.rarity)}`;
                rBadge.textContent = card.rarity;
                cardEl.appendChild(rBadge);

                makeDraggableStackCard(cardEl, card, idx);
                container.appendChild(cardEl);
            });
        }

        function makeDraggableStackCard(el, cardData, initialIdx) {
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let dragging = false;

            const startDrag = (e) => {
                dragging = true;
                const pt = e.touches ? e.touches[0] : e;
                startX = pt.clientX; startY = pt.clientY;

                window.addEventListener('mousemove', moveDrag);
                window.addEventListener('touchmove', moveDrag, { passive: false });
                window.addEventListener('mouseup', endDrag);
                window.addEventListener('touchend', endDrag);
            };

            const moveDrag = (e) => {
                if (!dragging) return;
                const pt = e.touches ? e.touches[0] : e;
                currentX = pt.clientX - startX; currentY = pt.clientY - startY;
                el.style.transform = `translate(${initialIdx * 2 + currentX}px, ${initialIdx * 2 + currentY}px) rotate(${currentX * 0.08}deg)`;
            };

            const endDrag = () => {
                if (!dragging) return;
                dragging = false;

                window.removeEventListener('mousemove', moveDrag);
                window.removeEventListener('touchmove', moveDrag);
                window.removeEventListener('mouseup', endDrag);
                window.removeEventListener('touchend', endDrag);

                if (Math.abs(currentX) > 50 || Math.abs(currentY) > 50) {
                    el.style.transition = 'all 0.2s ease-out';
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.remove();
                        sendCardToDesk(cardData);
                        checkStackEmpty();
                    }, 150);
                } else {
                    el.style.transition = 'transform 0.2s';
                    el.style.transform = `translate(${initialIdx * 2}px, ${initialIdx * 2}px)`;
                    setTimeout(() => el.style.transition = '', 200);
                }
            };

            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: false });
        }

        function checkStackEmpty() {
            const container = document.getElementById('stackContainer');
            if (container.children.length === 0) {
                const nextBtn = document.getElementById('btnNextPack');
                document.getElementById('nextActionZone').style.display = 'flex';
                if(packInventory > 0) {
                    nextBtn.innerText = `⚡ 다음 팩 뜯기 (남은 팩: ${packInventory}개)`;
                } else {
                    nextBtn.innerText = `모든 팩을 다 뜯었습니다!`;
                }
            }
        }

        function sendCardToDesk(cardData) {
            document.getElementById('deskNotice').style.display = 'none';
            const offset = (tableCards.length * 20) % 200;

            const cardObj = {
                instanceId: cardData.instanceId,
                data: cardData,
                sleeve: false,
                toploader: false,
                psa: null,
                x: 30 + offset,
                y: 30 + (offset / 2),
                zIndex: ++globalZIndex
            };

            tableCards.push(cardObj);
            renderDesk();
        }

        function openNextPack() {
            if(packInventory <= 0) {
                alert("남은 팩이 없습니다!");
                switchView('shop');
                return;
            }
            renderPackToOpen();
        }

        function renderDesk() {
            const desk = document.getElementById('deskArea');
            document.querySelectorAll('.table-card').forEach(el => el.remove());

            tableCards.forEach((c) => {
                const el = document.createElement('div');
                el.className = 'table-card';
                if(c.sleeve) el.classList.add('sleeve-effect');
                if(c.toploader) el.classList.add('toploader-effect');

                el.style.left = c.x + 'px';
                el.style.top = c.y + 'px';
                el.style.zIndex = c.zIndex;

                const val = getLiveMarketPrice({ ...c.data, psa: c.psa });

                const menu = document.createElement('div');
                menu.className = 'card-menu';
                menu.innerHTML = `
                    <button onclick="toggleSleeve('${c.instanceId}')">✨슬리브</button>
                    <button onclick="toggleToploader('${c.instanceId}')">🛡️탑로더</button>
                    <button onclick="gradePSA('${c.instanceId}')">🔍PSA감정</button>
                    <button class="sell-btn" onclick="sellDeskCard('${c.instanceId}')">💰 판매 (${val.toLocaleString()}원)</button>
                `;
                el.appendChild(menu);

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-ui';
                imgDiv.style.backgroundImage = `url('${c.data.image}')`;
                
                const rBadge = document.createElement('div');
                rBadge.className = `rarity-badge ${getRarityBadgeClass(c.data.rarity)}`;
                rBadge.textContent = c.data.rarity;
                imgDiv.appendChild(rBadge);

                el.appendChild(imgDiv);

                if(c.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${c.psa}`;
                    el.appendChild(badge);
                }

                let dragging = false;
                let shiftX = 0, shiftY = 0;

                const startMove = (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    dragging = true;
                    c.zIndex = ++globalZIndex;
                    el.style.zIndex = c.zIndex;

                    const pt = e.touches ? e.touches[0] : e;
                    const rect = el.getBoundingClientRect();
                    shiftX = pt.clientX - rect.left;
                    shiftY = pt.clientY - rect.top;

                    window.addEventListener('mousemove', moveCard);
                    window.addEventListener('touchmove', moveCard, { passive: false });
                    window.addEventListener('mouseup', stopMove);
                    window.addEventListener('touchend', stopMove);
                };

                const moveCard = (e) => {
                    if (!dragging) return;
                    const pt = e.touches ? e.touches[0] : e;
                    const deskRect = desk.getBoundingClientRect();

                    let newX = pt.clientX - shiftX - deskRect.left;
                    let newY = pt.clientY - shiftY - deskRect.top;

                    newX = Math.max(0, Math.min(newX, desk.clientWidth - 110));
                    newY = Math.max(0, Math.min(newY, desk.clientHeight - 154));

                    el.style.left = newX + 'px';
                    el.style.top = newY + 'px';
                    c.x = newX; c.y = newY;
                };

                const stopMove = () => {
                    dragging = false;
                    window.removeEventListener('mousemove', moveCard);
                    window.removeEventListener('touchmove', moveCard);
                    window.removeEventListener('mouseup', stopMove);
                    window.removeEventListener('touchend', stopMove);
                };

                el.addEventListener('mousedown', startMove);
                el.addEventListener('touchstart', startMove, { passive: false });

                el.ondblclick = () => {
                    binder.push({ ...c.data, sleeve: c.sleeve, toploader: c.toploader, psa: c.psa, instanceId: c.instanceId });
                    tableCards = tableCards.filter(tc => tc.instanceId !== c.instanceId);
                    saveUserData();
                    updateUI();
                    renderDesk();
                    alert("📘 바인더에 저장되었습니다!");
                };

                desk.appendChild(el);
            });
        }

        function sellDeskCard(id) {
            const cardIndex = tableCards.findIndex(c => c.instanceId === id);
            if(cardIndex !== -1) {
                const card = tableCards[cardIndex];
                const price = getLiveMarketPrice({ ...card.data, psa: card.psa });
                
                gold += price;
                tableCards.splice(cardIndex, 1);
                saveUserData();
                updateUI();
                renderDesk();
                alert(`💰 카드를 실거래 시세인 ${price.toLocaleString()}원에 판매했습니다!`);
            }
        }

        function sellBinderCard(index) {
            if(index >= 0 && index < binder.length) {
                const card = binder[index];
                const price = getLiveMarketPrice(card);

                gold += price;
                binder.splice(index, 1);
                saveUserData();
                updateUI();
                renderBinder();
                alert(`💰 카드를 실거래 시세인 ${price.toLocaleString()}원에 판매했습니다!`);
            }
        }

        function toggleSleeve(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) { card.sleeve = !card.sleeve; renderDesk(); }
        }
        function toggleToploader(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) { card.toploader = !card.toploader; renderDesk(); }
        }
        function gradePSA(id) {
            const card = tableCards.find(c => c.instanceId === id);
            if(card) {
                const grades = [8, 9, 9, 10, 10];
                card.psa = grades[Math.floor(Math.random() * grades.length)];
                alert(`🔍 PSA 감정 결과: [PSA ${card.psa}] 등급을 받았습니다!`);
                renderDesk();
            }
        }

        function toggleBinderSleeve(idx) {
            binder[idx].sleeve = !binder[idx].sleeve;
            saveUserData();
            renderBinder();
        }
        function toggleBinderToploader(idx) {
            binder[idx].toploader = !binder[idx].toploader;
            saveUserData();
            renderBinder();
        }
        function gradeBinderPSA(idx) {
            const grades = [8, 9, 9, 10, 10];
            binder[idx].psa = grades[Math.floor(Math.random() * grades.length)];
            saveUserData();
            renderBinder();
            alert(`🔍 PSA 감정 결과: [PSA ${binder[idx].psa}] 등급을 받았습니다!`);
        }

        function refreshTable() {
            if(confirm("책상의 모든 카드를 정리하시겠습니까?")) {
                tableCards = [];
                renderDesk();
                document.getElementById('deskNotice').style.display = 'block';
            }
        }

        function renderBinder() {
            const grid = document.getElementById('binderGrid');
            grid.innerHTML = '';

            if(binder.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #aaa;">바인더가 비어있습니다.</p>`;
                return;
            }

            binder.forEach((card, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'binder-card-wrapper';

                const item = document.createElement('div');
                item.className = 'binder-card';
                if(card.sleeve) item.classList.add('sleeve-effect');
                if(card.toploader) item.classList.add('toploader-effect');

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-ui';
                imgDiv.style.backgroundImage = `url('${card.image}')`;
                imgDiv.style.width = '100%'; imgDiv.style.height = '100%';
                imgDiv.style.borderRadius = '8px';
                imgDiv.style.backgroundSize = 'cover';

                const rBadge = document.createElement('div');
                rBadge.className = `rarity-badge ${getRarityBadgeClass(card.rarity)}`;
                rBadge.textContent = card.rarity;
                imgDiv.appendChild(rBadge);

                item.appendChild(imgDiv);

                if(card.psa) {
                    const badge = document.createElement('div');
                    badge.className = 'psa-badge';
                    badge.textContent = `PSA ${card.psa}`;
                    item.appendChild(badge);
                }

                wrapper.appendChild(item);

                const price = getLiveMarketPrice(card);

                const priceTag = document.createElement('div');
                priceTag.className = 'market-price-tag';
                priceTag.innerHTML = `시세: ${price.toLocaleString()}원`;
                wrapper.appendChild(priceTag);

                const btnGroup = document.createElement('div');
                btnGroup.className = 'binder-btn-group';
                btnGroup.innerHTML = `
                    <button onclick="toggleBinderSleeve(${idx})">${card.sleeve ? '✨ 슬리브 해제' : '✨ 슬리브 착용'}</button>
                    <button onclick="toggleBinderToploader(${idx})">${card.toploader ? '🛡️ 탑로더 해제' : '🛡️ 탑로더 착용'}</button>
                    <button onclick="gradeBinderPSA(${idx})">🔍 PSA 감정</button>
                    <button class="sell-btn" onclick="sellBinderCard(${idx})">💰 판매 (${price.toLocaleString()}원)</button>
                `;

                wrapper.appendChild(btnGroup);
                grid.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
